.battle-top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.fighter{background:#171d2a;border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.1)}.fighter.enemy{transform-origin:center}.name{font-size:1.2rem;font-weight:700}.bar{height:16px;background:#0a0d12;border-radius:99px;overflow:hidden;margin:4px 0 8px}.fill{height:100%;transition:width .35s}.hp{background:linear-gradient(90deg,#30bd66,#80e59c)}.mental{background:linear-gradient(90deg,#8d64e8,#c695ff)}.mp{background:linear-gradient(90deg,#3d9cdb,#77d0ff)}.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-top:14px}.move-section{

/* =========================
   キャラ選択アイコン
========================= */

.select-character-head{
  display:flex;

}

.select-character-head h3{

}

.select-character-icon,

}

.select-character-icon-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:.7rem;

}

/* 専用技 */
.move-section-title.unique{

}

.move.unique{
  background:#65315a;
}

.move.unique:hover{
  background:#7b3d6e;
}

/* 使える技 */
.move-section-title.usable{

  color:#d8e9ff;
}

/* 共通コマンド */

.move.common:hover{

}.move{min-height:64px;text-align:left}.log{height:260px;overflow:auto;background:#090c12;border-radius:14px;padding:12px;font-size:.94rem;line-height:1.5}.flash{animation:flash .35s}.shake{animation:shake .28s}.heal{animation:heal .55s}@keyframes flash{50%{filter:brightness(2)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes heal{50%{box-shadow:0 0 25px #6dff9c}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{height:8px}.hidden{display:none!important}.result{font-size:1.5rem;font-weight:800;text-align:center;padding:18px}.room{font-size:2rem;letter-spacing:.25em;font-weight:800;color:var(--gold)}
@media(max-width:700px){.fighters{grid-template-columns:1fr}.log{height:190px}.app{padding:10px}.moves{grid-template-columns:1fr 1fr}.btn{padding:11px}.character-grid{grid-template-columns:1fr 1fr}.character{min-height:160px}.small{font-size:.82rem}}
/* =========================
   新戦闘画面
========================= */

.battle-stage{
  position:relative;
  width:100%;

  border-radius:18px;
  overflow:visible;

  background:#10131a;

  border:1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 16px 40px
    rgba(0,0,0,.35);
}

.battle-view{
  position:relative;
  width:100%;

  /* 1536×1024と同じ3:2 */
  aspect-ratio:3 / 2;

  overflow:visible;
  padding:12px;

  background-color:#78848b;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  /* HUDを上下にはみ出させるための余白 */
  margin-top:35px;
  margin-bottom:35px;
}


/* 上部 */

.battle-header{
  position:relative;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;
}


/* =========================
   敵HUD
========================= */

.enemy-hud-row{
  position:relative;
  z-index:15;

  display:flex;
  justify-content:flex-end;
  gap:8px;

  min-height:100px;

  /* 約1/3を背景の上へ出す */
  transform:translateY(-35px);
  
}

.player-hud{
  position:relative;
  z-index:20;

  width:46%;
  min-height:110px;

  /* 約1/3を背景の下へ出す */
  transform:translateY(37px);

  display:grid;
  grid-template-columns:82px 1fr;
  gap:10px;
  padding:10px;

  background:
    linear-gradient(
      180deg,
      rgba(20,36,52,.97),
      rgba(8,21,34,.97)
    );

  border:2px solid rgba(230,245,255,.85);
  border-radius:15px;
  box-shadow:0 7px 18px rgba(0,0,0,.4);
}

.enemy-hud{
  width:min(310px,32%);

  display:grid;
  grid-template-columns:62px 1fr;
  gap:8px;

  padding:8px;

  color:white;

  background:
    linear-gradient(
      180deg,
      rgba(20,36,52,.96),
      rgba(10,23,36,.96)
    );

  border:
    2px solid
    rgba(220,240,255,.8);

  border-radius:14px;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.35);
}

.hud-icon{
  width:62px;
  height:62px;

  object-fit:contain;

  background:
    rgba(255,255,255,.08);

  border:
    2px solid
    rgba(255,255,255,.45);

  border-radius:10px;
}

.hud-icon-placeholder{
  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    #35445a;

  border:
    2px solid
    rgba(255,255,255,.45);

  border-radius:10px;

  font-size:.72rem;
  color:#d9e3ef;
}

.hud-name{
  font-weight:800;
  margin-bottom:3px;
}

.mini-stat{
  display:grid;

  grid-template-columns:
    35px 1fr 70px;

  gap:5px;
  align-items:center;

  font-size:.75rem;
}

.mini-bar{
  height:9px;

  background:#070b10;

  border-radius:99px;

  overflow:visible;
}

.mini-fill{
  height:100%;

  transition:
    width .3s;
}


/* =========================
   戦場
========================= */

.battle-field{
  position:relative;

  height:330px;

  margin-top:-10px;
}


/* 自分側 */

.player-sprite-area{
  position:absolute;

  left:1%;
  bottom:0;

  width:34%;
  height:92%;

  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
}


/* 敵側 */

.enemy-sprite-area{
  position:absolute;

  right:2%;
  top:25px;

  width:63%;
  height:75%;

  display:flex;
  justify-content:flex-end;
  align-items:flex-end;

  gap:2%;
}

/* =========================
   置物
========================= */

.fighter-with-object{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

/*
 キャラクター本体
*/
.fighter-main{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:2;
}

/*
 置物
*/
.summoned-object{
  position:absolute;

  bottom:0;
  right:-50%;

  width:100%;
  height:100%;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:1;

  pointer-events:none;
}

.summoned-object img{
  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center bottom;

  user-select:none;
  pointer-events:none;
}


/* =========================
   立ち絵
========================= */

.fighter-visual{
  position:relative;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  transform-origin:
    center bottom;
}

.player-visual{
  width:100%;
  height:100%;
}

.enemy-visual{
  width:30%;
  height:100%;
}

.battle-sprite{
  width:100%;
  height:100%;

  object-fit:contain;

  object-position:
    center bottom;

  user-select:none;

  pointer-events:none;
}

.sprite-placeholder{
  width:120px;
  height:210px;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  border:
    2px dashed
    rgba(255,255,255,.7);

  border-radius:20px;

  background:
    rgba(25,40,55,.55);

  color:white;

  font-weight:700;
}

.player-visual
.sprite-placeholder{
  width:190px;
  height:270px;
}


/* =========================
   メッセージ
========================= */

.battle-message{
  position:relative;
  z-index:20;

  min-height:92px;

  margin:
    -12px 4% 8px 36%;

  padding:
    19px 44px 19px 22px;

  display:flex;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      rgba(25,42,60,.97),
      rgba(8,22,35,.97)
    );

  border:
    4px solid
    #e9f4ff;

  outline:
    3px solid
    #31cbd5;

  border-radius:15px;

  box-shadow:
    0 7px 18px
    rgba(0,0,0,.35);

  font-size:
    clamp(
      1rem,
      2vw,
      1.35rem
    );

  font-weight:700;

  cursor:pointer;
}

.message-next{
  position:absolute;

  right:15px;
  bottom:9px;

  opacity:.75;

  animation:
    messageArrow
    .8s
    infinite alternate;
}

@keyframes messageArrow{
  from{
    transform:
      translateY(-2px);
  }

  to{
    transform:
      translateY(3px);
  }
}


/* =========================
   自分HUD
========================= */

.player-hud{
  position:relative;
  z-index:20;

  width:46%;

  min-height:110px;

  margin-top:-2px;

  display:grid;

  grid-template-columns:
    82px 1fr;

  gap:10px;

  padding:10px;

  background:
    linear-gradient(
      180deg,
      rgba(20,36,52,.97),
      rgba(8,21,34,.97)
    );

  border:
    2px solid
    rgba(230,245,255,.85);

  border-radius:15px;

  box-shadow:
    0 7px 18px
    rgba(0,0,0,.4);
}

.player-hud
.hud-icon,
.player-hud
.hud-icon-placeholder{
  width:82px;
  height:82px;
}


/* =========================
   コマンド
========================= */

.battle-command{
  position:relative;
  z-index:25;

  margin-top:10px;

  padding:10px;

  background:
    rgba(9,20,32,.94);

  border:
    2px solid
    rgba(190,220,245,.55);

  border-radius:16px;
}

.battle-switch{
  position:relative;
  z-index:25;

  margin-top:8px;
}


/* =========================
   立ち絵エフェクト
   赤     = ダメージ
   黄     = バフ
   青     = デバフ
   ピンク = 回復

   ※キャラクター画像そのものだけ変色
   ※周囲への発光なし
========================= */

.effect-damage .battle-sprite{
  animation:effectDamage .5s;
}

.effect-buff .battle-sprite{
  animation:effectBuff .55s;
}

.effect-debuff .battle-sprite{
  animation:effectDebuff .55s;
}

.effect-heal .battle-sprite{
  animation:effectHeal .55s;
}


/* ダメージ：赤 */
@keyframes effectDamage{

  0%,100%{
    filter:none;
    transform:translateX(0);
  }

  25%{
    filter:
      brightness(1.15)
      sepia(1)
      saturate(12)
      hue-rotate(315deg);

    transform:translateX(-6px);
  }

  50%{
    filter:
      brightness(1.15)
      sepia(1)
      saturate(12)
      hue-rotate(315deg);

    transform:translateX(6px);
  }

  75%{
    filter:
      brightness(1.15)
      sepia(1)
      saturate(12)
      hue-rotate(315deg);

    transform:translateX(-3px);
  }
}


/* バフ：黄 */
@keyframes effectBuff{

  0%,100%{
    filter:none;
  }

  50%{
    filter:
      brightness(1.45)
      sepia(1)
      saturate(9)
      hue-rotate(5deg);
  }
}


/* デバフ：青 */
@keyframes effectDebuff{

  0%,100%{
    filter:none;
  }

  50%{
    filter:
      brightness(1.25)
      sepia(1)
      saturate(9)
      hue-rotate(155deg);
  }
}


/* 回復：ピンク */
@keyframes effectHeal{

  0%,100%{
    filter:none;
  }

  50%{
    filter:
      brightness(1.4)
      sepia(1)
      saturate(8)
      hue-rotate(285deg);
  }
}

<body>
<div class="app">

<section id="home" class="screen active">
  <div class="card">
    <h1>妖怪ウォッチ2 覇道</h1>
    <p class="small">HPまたはメンタルが0になった瞬間に脱落。ターン開始時MP回復。補正後の数値は四捨五入。</p>
    <div class="grid home-grid">
      <div class="card">
        <h2>CPと対戦</h2>
        <button class="btn primary" onclick="openMode('cpu')">ゲームモード選択</button>
      </div>
      <div class="card">
        <h2>オンライン友人戦</h2>
        <p class="small">4桁の部屋番号を使って友人とオンライン対戦できます。</p>
        <button class="btn" onclick="openOnline()">部屋メニュー</button>
      </div>
    </div>
  </div>
</section>

<section id="online" class="screen">
  <div class="card">
    <h2>オンライン友人戦</h2>
    <div class="row">
      <button class="btn primary" onclick="createRoom()">部屋を作る</button>
      <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="4桁"/>
      <button class="btn" onclick="joinRoom()">参加</button>

/* =========================
   戦闘メッセージ
========================= */

let battleMessageQueue=[];

let battleMessageTimer=null;

let battleMessagePlaying=false;

let queuedBattleLogCount=0;  
let pendingBattleResult=null;
  
function isOnlineHost(){
 return appState.connection==='friend'&&onlinePlayerId===onlineHostId;
}

function mySide(){
 if(appState.connection!=='friend')return 0;
 const b=appState.battle;
 if(!b)return 0;
 const i=b.teams.findIndex(t=>t.some(f=>f.ownerId===onlinePlayerId));
 return i>=0?i:0;
}

function sendOnline(data){
 if(socket&&socket.readyState===WebSocket.OPEN){
  socket.send(JSON.stringify(data));
 }
}

function connectOnline(){
 return new Promise((resolve,reject)=>{
  if(socket&&socket.readyState===WebSocket.OPEN)return resolve();

  const protocol=location.protocol==='https:'?'wss:':'ws:';
  socket=new WebSocket(`${protocol}//${location.host}`);

  socket.addEventListener('open',()=>resolve(),{once:true});
  socket.addEventListener('error',()=>reject(new Error('接続失敗')),{once:true});
  socket.addEventListener('message',event=>{
   try{
    handleOnlineMessage(JSON.parse(event.data));
   }catch(e){
    console.error(e);
   }
  });
 });
}

function handleOnlineMessage(data){

 if(data.type==='room_created'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋番号</p>
    <div class="room">${data.roomCode}</div>
    <p class="small">友達の参加を待っています…</p>
    <p id="onlinePlayerCount">参加人数 1人</p>`;
 }

 if(data.type==='room_joined'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋 ${data.roomCode} に参加しました。</p>
    <p id="onlinePlayerCount">参加人数を確認中…</p>
    <p class="small">部屋を作った人がモードを選びます。</p>`;

  if(data.mode&&data.mode!=='pending'){
   appState.mode=data.mode;
   appState.selected=[];
   renderSelection();
   show('select');
  }
 }

 if(data.type==='room_state'){
  onlineHostId=data.hostId;

  const el=document.getElementById('onlinePlayerCount');
  if(el)el.textContent=`参加人数 ${data.count}人`;

  if(!data.started&&data.mode==='pending'&&isOnlineHost()&&data.count>=2){
   const info=document.getElementById('roomInfo');

   if(info&&!document.getElementById('modeGoBtn')){
    info.insertAdjacentHTML(
     'beforeend',
     '<button id="modeGoBtn" class="btn primary" onclick="show(\'mode\')">ゲームモード選択へ</button>'
    );
   }
  }
 }

 if(data.type==='mode_set'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  appState.selected=[];
  renderSelection();
  show('select');
 }

 if(data.type==='ready_state'){
  const ri=document.getElementById('readyInfo');

  if(ri){
   ri.textContent=`準備完了 ${data.readyCount}/${data.total}`;
  }

  const me=data.players?.find(p=>p.id===onlinePlayerId);
  const btn=document.getElementById('startBtn');

  if(btn&&me?.ready){
   btn.disabled=true;
   btn.textContent='準備完了済み';
  }
 }

 if(data.type==='battle_start'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  onlineWaitingAction=false;

   buildOnlineBattle(data.players,data.mode);
  show('battle');

  startBattleBgm();

  if(isOnlineHost()){
   beginTurn();
   broadcastBattleState();
  }else{
   document.getElementById('moves').innerHTML=
    '<button class="btn" disabled>対戦開始を同期中…</button>';
  }
 }

 if(data.type==='action_selected'){
  const tl=document.getElementById('turnLabel');

  if(tl&&appState.battle){
   tl.textContent=
    `ターン ${appState.battle.turn}　行動待ち ${data.selectedCount}/${data.total}`;
  }
 }

 if(
  data.type==='all_actions_selected' &&
  isOnlineHost() &&
  appState.battle &&
  !appState.battle.finished
 ){
  runOnlineTurn(data.actions);
  broadcastBattleState();
 }

if(data.type==='battle_state'){

 appState.battle=data.battle;
 onlineWaitingAction=false;

 show('battle');

 /*
  ホストから終了済み戦闘が届いても
  即リザルトには移動しない。
 */
 if(appState.battle.finished){

  pendingBattleResult={
   text:
    appState.battle.winnerOwnerId===
    onlinePlayerId
     ?'勝利'
     :'敗北',

   winnerOwnerId:
    appState.battle.winnerOwnerId
  };

  renderBattle();

  return;
 }

 renderBattle();

 maybeAutoOnlineAction();
}
 if(data.type==='player_left'){
  alert('参加者が退出しました。');
 }

 if(data.type==='error'){
  alert(data.message);
 }
}

  alert('オンラインサーバーに接続できません。');

}

async function joinRoom(){
 const v=document.getElementById('roomInput').value.trim();

 if(!/^\d{4}$/.test(v)){
  return alert('4桁の部屋番号を入力してください。');
 }

 try{
  await connectOnline();
  sendOnline({type:'join_room',roomCode:v});
  document.getElementById('roomInfo').innerHTML='<p>部屋に接続しています…</p>';
 }catch(e){
  alert('オンラインサーバーに接続できません。');
 }
}

function setMode(m){

  if(!isOnlineHost()){
   return alert('ゲームモードは部屋を作った人が選択します。');
  }

  sendOnline({
   type:'set_mode',
   mode:m
  });

  return;
 }

 appState.mode=m;
 appState.selected=[];
 renderSelection();
 show('select');
}

function selectChar(i){

 const need=appState.mode==='team3'?3:1;

 if(appState.selected.includes(i)){
  appState.selected=
   appState.selected.filter(x=>x!==i);

 }else if(appState.selected.length<need){
  appState.selected.push(i);

 }else{
  appState.selected[appState.selected.length-1]=i;
 }

 renderSelection();
}

function characterDetail(c){
 return `${c.name}
HP ${c.hp} / 精神 ${c.mental} / MP ${c.mp}
種族: ${c.races.join(', ')}
特性: ${c.traits.join(', ')}
技: ${Object.keys({...commonMoves,...c.moves}).join(', ')}`;
}

function attachTip(el,text){

 let timer;
 const tip=document.getElementById('tooltip');

 el.addEventListener('mouseenter',e=>{
  if(matchMedia('(hover:hover)').matches){
   tip.textContent=text;
   tip.style.display='block';
   moveTip(e);
  }
 });

 el.addEventListener('mousemove',moveTip);

 el.addEventListener('mouseleave',()=>{
  tip.style.display='none';
 });

 el.addEventListener('touchstart',()=>{
  timer=setTimeout(()=>{
   tip.textContent=text;
   tip.style.left='12px';
   tip.style.bottom='12px';
   tip.style.top='auto';
   tip.style.display='block';
  },450);
 },{passive:true});

 el.addEventListener('touchend',()=>{
  clearTimeout(timer);
  setTimeout(()=>{
   tip.style.display='none';
  },700);
 });
}

function moveTip(e){
 const tip=document.getElementById('tooltip');

 tip.style.left=
  Math.min(innerWidth-370,e.clientX+15)+'px';

 tip.style.top=
  Math.min(innerHeight-220,e.clientY+15)+'px';
}

async function startBattle(){

 const need=
  appState.mode==='team3'?3:1;

 if(appState.selected.length<need){
  return alert(
   `キャラを${need}人選択してください。`
  );
 }

 /*
  =========================
  オンライン
  =========================
 */

 if(appState.connection==='friend'){

  const btn=
   document.getElementById('startBtn');

  if(btn){
   btn.disabled=true;
   btn.textContent='準備完了済み';
  }

  const ri=
   document.getElementById('readyInfo');

  if(ri){
   ri.textContent='準備完了！';
  }

  /*
   ready.mp3が終わるまで待つ
  */
  await playReadyAndWait();

  /*
   鳴り終わってから
   準備完了をサーバーへ送信
  */
  sendOnline({
   type:'ready',
   selections:[...appState.selected]
  });

  if(ri){
   ri.textContent=
    'ほかの参加者を待っています…';
  }

  return;
 }


 /*
  =========================
  CPU戦
  =========================
 */

 const btn=
  document.getElementById('startBtn');

 if(btn){
  btn.disabled=true;
 }

 /*
  ready.mp3が終わるまで
  キャラ選択画面のまま待つ
 */
 await playReadyAndWait();


 /*
  =========================
  CPキャラ決定
  =========================
 */

 const used=
  new Set(appState.selected);

const pool=
  chars
   .map((_,i)=>i)
   .filter(
    i=>
     !used.has(i)
   );
 shuffle(pool);


 /*
  =========================
  戦闘データ作成
  =========================
 */

 let b={
  turn:1,
  mode:appState.mode,
  teams:[],
  active:[0,0],
  log:[],
  finished:false
 };


 /*
  タイマン
 */
 if(appState.mode==='duel'){

  b.teams=[
   [
    cloneFighter(
     chars[appState.selected[0]],
     0
    )
   ],
   [
    cloneFighter(
     chars[pool[0]],
     1
    )
   ]
  ];


 /*
  3 vs 3
 */
 }else if(appState.mode==='team3'){

  b.teams=[
   appState.selected.map(
    (i,j)=>
     cloneFighter(
      chars[i],
      0,
      j
     )
   ),

   pool.slice(0,3).map(
    (i,j)=>
     cloneFighter(
      chars[i],
      1,
      j
     )
   )
  ];


 /*
  乱闘
 */
 }else{

  b.teams=[
   [
    cloneFighter(
     chars[appState.selected[0]],
     0
    )
   ],
   [
    cloneFighter(
     chars[pool[0]],
     1
    )
   ],
   [
    cloneFighter(
     chars[pool[1]],
     2
    )
   ],
   [
    cloneFighter(
     chars[pool[2]],
     3
    )
   ]
  ];

  b.active=[
   0,
   0,
   0,
   0
  ];
 }


 /*
  =========================
  戦闘開始
  =========================
 */

 appState.battle=b;

 resetBattleMessages();

 appState.lastSetup={
  ...appState,
  selected:[...appState.selected],
  battle:null,
  lastSetup:null
 };

 /*
  readyが完全に終了した後なので、
  ここで初めて戦闘画面へ移動
 */
chooseBattleBackground();

show('battle');

startBattleBgm();

beginTurn();
}
function buildOnlineBattle(players,mode){

 const teams=
  players.map(
   (p,side)=>
    p.selections.map(
     (ci,j)=>{
      const f=
       cloneFighter(
        chars[ci],
        side,
        j
       );

      f.ownerId=p.id;

      return f;
     }
    )
  );

 appState.battle={
  turn:1,
  mode,
  teams,
  active:teams.map(()=>0),
  log:[],
  finished:false,
  winnerOwnerId:null
 };
  resetBattleMessages();
}

function aliveOnlinePlayerIds(){

 const b=appState.battle;

 return b.teams
  .filter(
   t=>t.some(f=>f.alive)
  )
  .map(
   t=>t.find(Boolean)?.ownerId
  )
  .filter(Boolean);
}

function broadcastBattleState(){

 if(
  !isOnlineHost() ||
  !appState.battle
 ){
  return;
 }

 sendOnline({
  type:'battle_state',
  battle:appState.battle,
  alivePlayerIds:
   aliveOnlinePlayerIds()
 });
}

function submitOnlineAction(action){

 if(
  onlineWaitingAction ||
  !appState.battle ||
  appState.battle.finished
 ){
  return;
 }

 onlineWaitingAction=true;

 sendOnline({
  type:'action',
  action
 });

 renderMoves();
}

function maybeAutoOnlineAction(){

 if(
  appState.connection!=='friend' ||
  onlineWaitingAction ||
  !appState.battle ||
  appState.battle.finished
 ){
  return;
 }

 const f=
  activeF(mySide());

 if(
  f &&
  f.alive &&
  f.swimming
 ){
  setTimeout(
   ()=>submitOnlineAction({type:'none'}),
   0
  );
 }
}

function runOnlineTurn(actions){

 const b=appState.battle;

 if(!b||b.finished){
  return;
 }

 let acts=[];

 for(
  let s=0;
  s<b.teams.length;
  s++
 ){
  const f=activeF(s);

  if(!f||!f.alive){
   continue;
  }

  const a=
   actions[f.ownerId]||
   {type:'none'};

  acts.push({f,a});
 }

 prepareTurnActions(acts);

acts=sortTurnActions(acts);
 for(const x of acts){

  if(!x.f.alive){
   continue;
  }

  let targets=
 livingEnemies(x.f);
 

  executeAction(
   x.f,
   x.a,
   targets
  );

  checkDeaths();

  if(b.finished){
   break;
  }
 }

 if(!b.finished){
  endTurn();
 }
}

function shuffle(a){
 for(
  let i=a.length-1;
  i>0;
  i--
 ){
  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}

function activeF(side){
 const b=appState.battle;
 return b.teams[side][b.active[side]||0];
}

function allActive(){
 const b=appState.battle;

 return b.teams
  .map(
   (t,i)=>t[b.active[i]||0]
  )
  .filter(Boolean);
}

function livingEnemies(f){

 return allActive().filter(
  t=>
   t &&
   t!==f &&
   t.alive &&
   t.hp>0 &&
   t.mental>0 &&
   t.side!==f.side
 );
}

function randomLivingEnemy(f){

 const enemies=
  livingEnemies(f);

 if(!enemies.length){
  return null;
 }

 return enemies[
  Math.floor(
   Math.random()*enemies.length
  )
 ];
}

function beginTurn(){

 const b=appState.battle;

 if(b.finished){
  return;
 }

 allActive().forEach(f=>{

  if(!f.alive){
   return;
  }

   /*
 HG：
 場にいる「おんな」以外の誰か1人から
 毎ターンHP・精神を5吸収
*/
if(f.traits.includes('HG')){

 const candidates=
  allActive().filter(
   t=>
    t!==f &&
    t.alive &&
    !t.races.includes('おんな')
  );

 if(candidates.length){

  const t=
   candidates[
    Math.floor(
     Math.random()*candidates.length
    )
   ];

  const hpTake=
   Math.min(
    5,
    Math.max(0,t.hp)
   );

  const mentalTake=
   Math.min(
    5,
    Math.max(0,t.mental)
   );

  t.hp-=hpTake;
  t.mental-=mentalTake;

  f.hp=
   Math.min(
    f.maxHp,
    f.hp+hpTake
   );

  f.mental=
   Math.min(
    f.maxMental,
    f.mental+mentalTake
   );

  log(
   `${f.name}はHGで${t.name}からHP${hpTake}・精神${mentalTake}を吸収した！`,
   'heal',
   f.side,
   'heal',
   statSnapshot(f)
  );

  log(
   `${t.name}はHGでHP${hpTake}・精神${mentalTake}を吸収された！`,
   'damage',
   t.side,
   'damage',
   statSnapshot(t)
  );
 }
}
/*
 たいりくのはしゃ
 毎ターン物理攻撃力×1.2
 最大4回まで重複
*/
if(
 f.traits.includes('たいりくのはしゃ') &&
 (f.continentalStacks||0)<4
){

 f.continentalStacks++;

 log(
  `${f.name}のたいりくのはしゃ！ 物理攻撃力×${Math.pow(1.2,f.continentalStacks).toFixed(2)}`,
  'buff',
  f.side,
  'buff'
 );
}
   /*
 ターン開始時MP回復
*/
let regen=
 1+
 (
  f.traits.includes('めんざいたいしつ')
   ?1
   :0
 );

/*
 そうせいおう

 ・毎ターンMP上限+1
 ・そのターンのMP回復量は1か2を毎回抽選
*/
if(f.traits.includes('そうせいおう')){

 f.maxMp+=1;

 regen=
  1+
  (
   Math.random()<P.normal
    ?1
    :0
  );
}


/*
 しめあげる

 通常キャラは回復量1に固定。

 そうせいおうの場合は、
 本来1か2回復するところから1減らされ、
 0か1回復になる。
*/
if((f.mpRegenLock||0)>0){

 if(f.traits.includes('そうせいおう')){

  regen=Math.max(
   0,
   regen-1
  );

 }else{

  regen=1;
 }
}


f.mp=
 Math.min(
  f.maxMp,
  f.mp+regen
 );


if((f.mpRegenLock||0)>0){
 f.mpRegenLock--;
}
  /*
 むしばダメージ
*/
if(f.traits.includes('むしば')){

 directDamage(
  f,
  2,
  2,
  'むしば'
 );
}

/*
 ゆうまのむしば感染

 ゆうまが場にいて、
 相手がまだむしばではなく、
 「しかい」も持っていない場合、
 50%で感染する
*/
if(
 f.name==='ゆうま' &&
 f.traits.includes('むしば')
){

 for(const t of livingEnemies(f)){

  if(
   !t.traits.includes('むしば') &&
   !t.traits.includes('しかい') &&
   Math.random()<P.normal
  ){

   t.traits.push('むしば');

   log(
    `${t.name}にむしばが感染した！`,
    'debuff',
    t.side,
    'debuff'
   );
  }
 }
}

  if(
 f.traits.includes('じあいのこころ')
){

 const before=f.mental;

 f.mental=
  Math.min(
   f.maxMental,
   f.mental+5
  );

 if(f.mental>before){

  log(
   `${f.name}はじあいのこころで精神が${f.mental-before}回復した！`,
   'heal',
   f.side,
   'heal',
   statSnapshot(f)
  );
 }
}

  if(f.haruka){

 const before=f.mental;

 f.mental=
  Math.min(
   f.maxMental,
   f.mental+5
  );

 if(f.mental>before){

  log(
   `${f.name}ははるかで精神が${f.mental-before}回復した！`,
   'heal',
   f.side,
   'heal',
   statSnapshot(f)
  );
 }
}
  if(
 f.traits.includes('ちゅうそつのいでんし') &&
 Math.random()<P.normal
){

 const before=f.hp;

 f.hp=
  Math.min(
   f.maxHp,
   f.hp+5
  );

 if(f.hp>before){

  log(
   `${f.name}はちゅうそつのいでんしでHPが${f.hp-before}回復した！`,
   'heal',
   f.side,
   'heal',
   statSnapshot(f)
  );
 }
}

  if(
   f.traits.includes('できん')
  ){
   f.mentalBuff*=1.17;
  }

// にじゅうじんかく
f.dualPhysical = 1;
f.dualMental = 1;

if(f.traits.includes('にじゅうじんかく')){
  if(Math.random() < 0.5){
    f.dualPhysical = 1.2;
    f.dualMental = 0.7;
  }else{
    f.dualPhysical = 0.7;
    f.dualMental = 1.2;
  }
}
   
 if(
 f.traits.includes('むげん成長')
){

 f.growthP*=1.08;
 f.growthM*=1.08;

 f.maxHp-=4;
 f.hp=Math.min(
  f.hp,
  f.maxHp
 );

 f.maxMp+=1;

 log(
  `${f.name}はむげん成長した！ 最大HPが4減少した`,
  'buff',
  f.side,
  'buff',
  statSnapshot(f)
 );
}

  if(f.verbalDot>0){
   directDamage(
    f,
    0,
    5*f.verbalDot,
    'ばとう'
   );
  }
   if(f.parasiteStacks>0){

 directDamage(
  f,
  5*f.parasiteStacks,
  5*f.parasiteStacks,
  `きせい×${f.parasiteStacks}`
 );
}
 });
  

 applyGlobalStart();
 checkDeaths();
 renderBattle();
 log(`--- ターン ${b.turn} ---`);

 if(
  !b.finished &&
  appState.connection==='cpu' &&
  activeF(0)?.swimming
 ){
  setTimeout(()=>{
   const cur=
    appState.battle;

   if(
    cur &&
    !cur.finished &&
    activeF(0)?.swimming
   ){
    runTurn({type:'none'});
   }
  },0);
 }

 if(
  !b.finished &&
  appState.connection==='friend'
 ){
  maybeAutoOnlineAction();
 }
}

function applyGlobalStart(){

 const acts=allActive();

 for(const src of acts){

  if(src.traits.includes('あくしゅう')){

   for(const t of acts){

    if(t!==src&&t.alive){
    applyDamage(
 src,
 t,
 {
  mental:2,
  tags:['におい']
 },
 true
);
    }
   }
  }
 }

 for(const src of acts){

  if(src.traits.includes('うわきしょう')){

   const women=
    acts.filter(
     x=>
      x!==src &&
      x.races.includes('おんな') &&
      x.alive
    );

   for(const w of women){

    const take=
     Math.min(5,w.mp);

    w.mp-=take;

    src.mp=
     Math.min(
      src.maxMp,
      src.mp+take
     );
   }

   if(
    women.length &&
    Math.random()<P.normal
   ){
    if(
 women.length &&
 Math.random()<P.normal
){

 if(Math.random()<.5){

  directDamage(
   src,
   5*women.length,
   0,
   'うわきしょう反動'
  );

 }else{

  directDamage(
   src,
   0,
   5*women.length,
   'うわきしょう反動'
  );
 }
}
   }
  }
 }
}
  function getCharacterAssets(name){

 return (
  battleAssets.characters[name] ||
  {
   player:'',
   enemy:'',
   icon:''
  }
 );
}

function summonedObjectHtml(
 fighter,
 type
){

 if(!fighter){
  return '';
 }

 let object=null;
 let name='';


 /*
  ガンダム
 */
 if(fighter.gundam){

  object=
   battleAssets.objects?.gundam;

  name='ガンダム';
 }


 /*
  はるか
 */
 else if(fighter.haruka){

  object=
   battleAssets.objects?.haruka;

  name='はるか';
 }
   else if(fighter.remi){

  object=
   battleAssets.objects?.remi;

  name='れみ';
 }


 /*
  置物なし
 */
 if(!object){
  return '';
 }


 /*
  自分側・敵側で画像を分ける
 */
 const src=
  type==='player'
   ?object.player
   :object.enemy;


 if(!src){
  return '';
 }


 return `
  <div
   class="summoned-object"
   title="${name}"
  >
   <img
    src="${src}"
    alt="${name}"
   >
  </div>
 `;
}


function spriteHtml(
 fighter,
 type
){

 const assets=
  getCharacterAssets(
   fighter.name
  );

 const src=
  type==='player'
   ?assets.player
   :assets.enemy;


 /*
  キャラクター本体
 */
 let mainHtml='';

 if(src){

  mainHtml=`
   <img
    class="battle-sprite"
    src="${src}"
    alt="${fighter.name}"
   >
  `;

 }else{

  mainHtml=`
   <div class="sprite-placeholder">
    ${fighter.name}<br>
    ${type==='player'
     ?'自分側立ち絵'
     :'敵側立ち絵'}
   </div>
  `;
 }


 /*
  置物
 */
 const objectHtml=
  summonedObjectHtml(
   fighter,
    type

  function miniStat(
 name,
 value,
 max,
 type
){

 const safeMax=
  Math.max(
   1,
   max
  );

 const percent=
  Math.max(
   0,
   Math.min(
    100,
    value/safeMax*100
   )
  );

 return `
  <div class="mini-stat">

   <span>
    ${name}
   </span>

   <div class="mini-bar">
    <div
     class="mini-fill ${type}"
     style="width:${percent}%"
    ></div>
   </div>

   <span class="stat-number">
    ${Math.max(
     0,
     Math.round(value)
    )}/${Math.round(max)}
   </span>

  </div>
 `;
}
function resetBattleMessages(){

 battleMessageQueue=[];

 battleMessagePlaying=false;

 queuedBattleLogCount=0;

pendingBattleResult=null;

 if(battleMessageTimer){

  clearTimeout(
   battleMessageTimer
  );

  battleMessageTimer=null;
 }

 if(text){

function syncBattleMessages(){

 const b=
  appState.battle;

 if(!b){
  return;
 }

 if(
  b.log.length<
  queuedBattleLogCount
 ){
  queuedBattleLogCount=0;
 }

 while(
 queuedBattleLogCount<
 b.log.length
){

 battleMessageQueue.push(
  b.log[
   queuedBattleLogCount
  ]
 );

 queuedBattleLogCount++;
}

 if(
  !battleMessagePlaying
 ){
  showNextBattleMessage();
 }
}


function showNextBattleMessage(){

 /*
  =========================
  キューが空
  =========================
 */

 if(!battleMessageQueue.length){

  battleMessagePlaying=false;
  battleMessageTimer=null;

  /*
   戦闘終了済みなら、
   最後の「倒れた。」をクリックしたあと
   リザルトへ進む
  */
  if(pendingBattleResult){

   const result=
    pendingBattleResult;

   pendingBattleResult=null;

   stopBattleBgm();

   document.getElementById(
    'resultText'
   ).textContent=
    result.text;

   if(result.text==='勝利'){

 playBattleSound(
  'victory'
 );

}else{

 sfx(

 );
}

  }

 if(box){

   typeof message==='string'

function getHolgonuPool(){

 const map=
  new Map();

 function addMoves(moves){

  for(
   const [name,move]
   of Object.entries(moves)
  ){

   if(
    name==='えんげき' ||
    name==='ホロゴヌ・サニア・コイケ'
   ){
    continue;
   }

   if(!map.has(name)){
    map.set(
     name,
     move
    );
   }
  }
 }

 // 共通行動
 addMoves(commonMoves);

 // 全キャラの
 // 専用技＋使える技
 for(const c of chars){
  addMoves(c.moves);
 }

 return [
  ...map.entries()
 ].map(
  ([name,move])=>({
   name,
   move
  })
 );
}

function prepareDefenseMove(f,m){

 if(!f||!m){

 m.special==='parthianShot'
){
 f.parthianDodging=true;
}

 if(m.priorityGuard){

if(

 ){

function prepareTurnActions(acts){

 for(const x of acts){

  x.f.plannedAction=
   x.a
    ?{...x.a}
    :{type:'none'};

  if(x.a?.type==='move'){

   const m=
    x.f.moves[x.a.name];

   prepareDefenseMove(
    x.f,
    m
   );
  }
 }

function runTurn(player){

 const b=
  appState.battle;

 if(b.finished){
  return;
 }

 let acts=[];

 if(b.mode==='ffa4'){

  acts.push({
   f:activeF(0),
   a:player
  });

  for(let s=1;s<4;s++){

   acts.push({
    f:activeF(s),
    a:chooseCpu(activeF(s))
   });
  }

 }else{

  acts=[
   {
    f:activeF(0),
    a:player
   },
   {
    f:activeF(1),
    a:chooseCpu(activeF(1))
   }
  ];
 }

prepareTurnActions(acts);
acts=sortTurnActions(acts);

 for(const x of acts){

  if(!x.f.alive){
   continue;
  }

 executeAction(
 x.f,
 x.a,
 livingEnemies(x.f)
);

  checkDeaths();

  if(b.finished){
   break;
  }
 }

 endTurn();

function priorityScore(x){

 }

 if(x.a.type!=='move'){

 const m=

 if(

 ){

 }

 if(m.priority){
  return 20;
 }

 if(

  allActive().some(
   t=>
    t!==x.f &&

  )
 ){

 ){

 }

 if(

 return 10;

if(

function shuffleTurnGroup(group){

 const a=[...group];

 for(let i=a.length-1;i>0;i--){

  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}


function sortTurnActions(acts){

 // priorityScoreごとに分類
 const groups=new Map();

 for(const x of acts){

  const p=
   priorityScore(x);

  if(!groups.has(p)){
   groups.set(p,[]);
  }

  groups.get(p).push(x);
 }

 // 優先度が高い順
 const priorities=
  [...groups.keys()]
   .sort((a,b)=>b-a);

 const result=[];

 for(const p of priorities){

  let group=
   groups.get(p);

  // 1人ならそのまま
  if(group.length<=1){

   result.push(...group);

   continue;
  }

  // まず通常キャラをランダムに並べる
  const normal=
   shuffleTurnGroup(
    group.filter(
     x=>
      (x.f.entangled||0)<=0
    )
   );

  // からみつかれているキャラ
  const entangled=
   shuffleTurnGroup(
    group.filter(
     x=>
      (x.f.entangled||0)>0
    )
   );

  /*
   からみつきがいない場合は
   普通のランダム順
  */
  if(!entangled.length){

   result.push(
    ...shuffleTurnGroup(group)
   );

   continue;
  }

  /*
   2人だけの場合

   からみつかれた側：
   20%で先行
   80%で後攻
  */
  if(
   group.length===2 &&
   entangled.length===1
  ){

   const e=
    entangled[0];

   const n=
    normal[0];

   if(Math.random()<0.2){

    result.push(
     e,
     n
    );

   }else{

    result.push(
     n,
     e
    );
   }

   continue;
  }

  /*
   乱闘など3人以上。

   からみつかれたキャラを
   1人ずつ配置する。
  */
  let ordered=[
   ...normal
  ];

  for(const e of entangled){

   if(ordered.length===0){

    ordered.push(e);

    continue;
   }

   if(Math.random()<0.8){

    // 80%で最後
    ordered.push(e);

   }else{

    /*
     残り20%では
     「最後以外」の位置を均等抽選
    */

    const position=
     Math.floor(
      Math.random()*
      ordered.length
     );

    ordered.splice(
     position,
     0,
     e
    );
   }
  }

  result.push(
   ...ordered
  );
 }

 return result;
}

function directDamage(
 t,
 p,
 q,
 why
){

 const hpDamage=
  Math.round(p||0);

 const mentalDamage=
  Math.round(q||0);

 t.hp-=hpDamage;
 t.mental-=mentalDamage;

 /*
  このダメージが入った
  「直後」の値を保存する。

  重要：
  後で現在値を読むのではなく、
  この瞬間のHP・精神をログに記録する。
 */
 const displayHpAfter=
  Math.max(
   0,
   t.hp
  );

 const displayMentalAfter=
  Math.max(
   0,
   t.mental
  );

 if(
  (hpDamage||mentalDamage) &&
  why
 ){

 log(
 `${t.name}に`+
 `${hpDamage
   ?` HP-${hpDamage}`
   :''
 }`+
 `${mentalDamage
   ?` 精神-${mentalDamage}`
   :''
 }`+
 ` (${why})`,
 'damage',
 t.side,
 'damage',
 {
  hp:displayHpAfter,
  mental:displayMentalAfter,
  maxHp:t.maxHp,
  maxMental:t.maxMental
 }
);
 }
}

function animateF(f,type){

  document.getElementById(
   'fighter-'+f.side
  );

 if(!e){
  return;
 }

  damage:'effect-damage',
  buff:'effect-buff',
  debuff:'effect-debuff',
  heal:'effect-heal',

  flash:'effect-buff',
  shake:'effect-damage'
 };

 const cl=
  map[type]||type;

 /*
  前の4色エフェクトを全部消す。
  同じキャラに連続でダメージなどが来ても
  毎回アニメーションを最初から再生できる。
 */
 e.classList.remove(
  'effect-damage',
  'effect-buff',
  'effect-debuff',
  'effect-heal'
 );

 void e.offsetWidth;

 e.classList.add(cl);

 setTimeout(()=>{

  /*
   renderBattle()でDOMが作り直されている
   可能性があるので、現在の要素を取り直す
  */
  const current=
   document.getElementById(
    'fighter-'+f.side
   );

  if(current){
   current.classList.remove(cl);
  }

 },600);
}

  battleAssets.sounds[name];

 if(!src){

   name
  );
  return;

 const audio=

 audio.volume=0.9;
 audio.preload='auto';

  );

  function playReadyAndWait(){

 return new Promise(resolve=>{

  const src=
   battleAssets.sounds.ready;

  if(!src){
   resolve();
   return;
  }

  const audio=
   new Audio(src);

  audio.volume=0.6;
  audio.preload='auto';

  let finished=false;

  const done=()=>{

   if(finished){
    return;
   }

   finished=true;
   resolve();
  };

  // ready.mp3が最後まで鳴ったら続行
  audio.addEventListener(
   'ended',
   done,
   {once:true}
  );

  // エラー時はゲームを止めず続行
  audio.addEventListener(
   'error',
   done,
   {once:true}
  );

  audio.play().catch(err=>{

   console.error(
    'ready効果音の再生に失敗:',
    err
   );

   done();
  });

 });
}
function sfx(freq=330,dur=.05){

 try{

  const A=
   window.AudioContext||
   window.webkitAudioContext;

  const c=
   sfx.ctx||
   (
    sfx.ctx=
     new A()
   );

  const o=
   c.createOscillator();

  const g=
   c.createGain();

  o.frequency.value=
   freq;

  g.gain.value=
   .025;

  o.connect(g);
  g.connect(
   c.destination
  );

  o.start();

  g.gain.exponentialRampToValueAtTime(
   .0001,
   c.currentTime+dur
  );

  o.stop(
   c.currentTime+dur
  );

 }catch(e){}
}

function log(
 s,
 effect=null,
 side=null,
 sound=null,
 displayStats=null
){

 const b=
  appState.battle;

 if(!b){
  return;
 }

 b.log.push({
  text:s,
  effect,
  side,
  sound,
  displayStats
 });

 renderBattle();
}
function retire(){

 if(
  appState.connection==='friend'
 ){
  return alert(
   '友人戦では退散できません。'
  );
 }

  stopBattleBgm();
 show('home');
}

function rematch(){

 if(
  appState.connection==='friend'
 ){
  return alert(
   'オンライン再戦は現在、部屋を作り直してください。'
  );
 }

 startBattle();
}

function backToSelect(){
 renderSelection();
 show('select');
}
 /* =========================
   ボタン効果音
========================= */

document.addEventListener('click', e=>{

 const btn=
  e.target.closest('.btn');

 if(
  !btn ||
  btn.disabled
 ){
  return;
 }

 /*
  startBtnは
  startBattle()内で鳴らす
 */
 if(btn.id==='startBtn'){
  return;
 }

 playButtonSe();

});
</script>
</body>
</html>
