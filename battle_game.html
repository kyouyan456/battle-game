<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>妖怪ウォッチ2 覇道</title>
<style>
:root{
  --bg:#10131a;--panel:#1b2030;--panel2:#242b3d;--text:#f4f7fb;--muted:#aeb7c7;--accent:#6fd3ff;--danger:#ff6b7a;--good:#77e08f;--gold:#ffd76f;
}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#1b2337,#0d1016 55%);color:var(--text);min-height:100vh}
button,select,input{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
h1,h2,h3{margin:.2em 0 .65em}.grid{display:grid;gap:14px}.home-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.btn{border:0;border-radius:13px;padding:12px 15px;background:#2e3850;color:#fff;cursor:pointer;transition:.15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.btn:hover{transform:translateY(-1px);background:#3a4663}.btn.primary{background:#267ea2}.btn.danger{background:#8b3340}.btn.good{background:#2d7a47}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.small{font-size:.9rem;color:var(--muted)}
.character-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.character{position:relative;cursor:pointer;min-height:185px}.character.selected{outline:3px solid var(--accent)}.tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#30384a;margin:2px;font-size:.78rem;color:#dce5f4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.stat{background:#111725;border-radius:10px;padding:7px;text-align:center}.tooltip{position:fixed;z-index:20;max-width:360px;background:#06080d;border:1px solid rgba(255,255,255,.2);padding:12px;border-radius:12px;display:none;white-space:pre-wrap;font-size:.9rem;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.battle-top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.fighter{background:#171d2a;border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.1)}.fighter.enemy{transform-origin:center}.name{font-size:1.2rem;font-weight:700}.bar{height:16px;background:#0a0d12;border-radius:99px;overflow:hidden;margin:4px 0 8px}.fill{height:100%;transition:width .35s}.hp{background:linear-gradient(90deg,#30bd66,#80e59c)}.mental{background:linear-gradient(90deg,#8d64e8,#c695ff)}.mp{background:linear-gradient(90deg,#3d9cdb,#77d0ff)}.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-top:14px}.move-section{
  width:100%;
  margin-top:14px;
}

.move-section-title{
  font-weight:800;
  margin:6px 0 8px;
  padding:6px 10px;
  border-radius:9px;
  font-size:.95rem;
}

.move-section-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:9px;
}

/* =========================
   キャラ選択アイコン
========================= */

.select-character-head{
  display:flex;
  align-items:center;
  gap:12px;
}

.select-character-head h3{
  margin:0;
}

.select-character-icon,
.select-character-icon-placeholder{
  width:72px;
  height:72px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:14px;

  border:2px solid
    rgba(255,255,255,.35);

  background:#283247;
}

.select-character-icon-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:.7rem;
  color:#dce5f4;
}

/* 専用技 */
.move-section-title.unique{
  background:#5b294f;
  color:#ffd8f2;
}

.move.unique{
  background:#65315a;
}

.move.unique:hover{
  background:#7b3d6e;
}

/* 使える技 */
.move-section-title.usable{
  background:#304a72;
  color:#d8e9ff;
}

.move.usable{
  background:#31527f;
}

.move.usable:hover{
  background:#3b6399;
}

/* 共通コマンド */
.move-section-title.common{
  background:#36553c;
  color:#ddffe4;
}

.move.common{
  background:#376443;
}

.move.common:hover{
  background:#447b52;
}.move{min-height:64px;text-align:left}.log{height:260px;overflow:auto;background:#090c12;border-radius:14px;padding:12px;font-size:.94rem;line-height:1.5}.flash{animation:flash .35s}.shake{animation:shake .28s}.heal{animation:heal .55s}@keyframes flash{50%{filter:brightness(2)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes heal{50%{box-shadow:0 0 25px #6dff9c}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{height:8px}.hidden{display:none!important}.result{font-size:1.5rem;font-weight:800;text-align:center;padding:18px}.room{font-size:2rem;letter-spacing:.25em;font-weight:800;color:var(--gold)}
@media(max-width:700px){.fighters{grid-template-columns:1fr}.log{height:190px}.app{padding:10px}.moves{grid-template-columns:1fr 1fr}.btn{padding:11px}.character-grid{grid-template-columns:1fr 1fr}.character{min-height:160px}.small{font-size:.82rem}}
/* =========================
   新戦闘画面
========================= */

.battle-stage{
  position:relative;
  width:100%;

  border-radius:18px;
  overflow:hidden;

  background:#10131a;

  border:1px solid
    rgba(255,255,255,.15);

  box-shadow:
    0 16px 40px
    rgba(0,0,0,.35);
}

.battle-view{
  position:relative;
  width:100%;

  /* 1536×1024と同じ3:2 */
  aspect-ratio:3 / 2;

  overflow:hidden;
  padding:12px;

  background-color:#78848b;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}


/* 上部 */

.battle-header{
  position:relative;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:8px;
}


/* =========================
   敵HUD
========================= */

.enemy-hud-row{
  position:relative;
  z-index:15;

  display:flex;
  justify-content:flex-end;
  gap:8px;

  min-height:100px;
}

.enemy-hud{
  width:min(310px,32%);

  display:grid;
  grid-template-columns:62px 1fr;
  gap:8px;

  padding:8px;

  color:white;

  background:
    linear-gradient(
      180deg,
      rgba(20,36,52,.96),
      rgba(10,23,36,.96)
    );

  border:
    2px solid
    rgba(220,240,255,.8);

  border-radius:14px;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.35);
}

.hud-icon{
  width:62px;
  height:62px;

  object-fit:contain;

  background:
    rgba(255,255,255,.08);

  border:
    2px solid
    rgba(255,255,255,.45);

  border-radius:10px;
}

.hud-icon-placeholder{
  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    #35445a;

  border:
    2px solid
    rgba(255,255,255,.45);

  border-radius:10px;

  font-size:.72rem;
  color:#d9e3ef;
}

.hud-name{
  font-weight:800;
  margin-bottom:3px;
}

.mini-stat{
  display:grid;

  grid-template-columns:
    35px 1fr 70px;

  gap:5px;
  align-items:center;

  font-size:.75rem;
}

.mini-bar{
  height:9px;

  background:#070b10;

  border-radius:99px;

  overflow:hidden;
}

.mini-fill{
  height:100%;

  transition:
    width .3s;
}


/* =========================
   戦場
========================= */

.battle-field{
  position:relative;

  height:330px;

  margin-top:-10px;
}


/* 自分側 */

.player-sprite-area{
  position:absolute;

  left:1%;
  bottom:0;

  width:34%;
  height:92%;

  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
}


/* 敵側 */

.enemy-sprite-area{
  position:absolute;

  right:2%;
  top:25px;

  width:63%;
  height:75%;

  display:flex;
  justify-content:flex-end;
  align-items:flex-end;

  gap:2%;
}


/* =========================
   立ち絵
========================= */

.fighter-visual{
  position:relative;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  transform-origin:
    center bottom;
}

.player-visual{
  width:100%;
  height:100%;
}

.enemy-visual{
  width:30%;
  height:100%;
}

.battle-sprite{
  width:100%;
  height:100%;

  object-fit:contain;

  object-position:
    center bottom;

  user-select:none;

  pointer-events:none;
}

.sprite-placeholder{
  width:120px;
  height:210px;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  border:
    2px dashed
    rgba(255,255,255,.7);

  border-radius:20px;

  background:
    rgba(25,40,55,.55);

  color:white;

  font-weight:700;
}

.player-visual
.sprite-placeholder{
  width:190px;
  height:270px;
}


/* =========================
   メッセージ
========================= */

.battle-message{
  position:relative;
  z-index:20;

  min-height:92px;

  margin:
    -12px 4% 8px 36%;

  padding:
    19px 44px 19px 22px;

  display:flex;
  align-items:center;

  background:
    linear-gradient(
      180deg,
      rgba(25,42,60,.97),
      rgba(8,22,35,.97)
    );

  border:
    4px solid
    #e9f4ff;

  outline:
    3px solid
    #31cbd5;

  border-radius:15px;

  box-shadow:
    0 7px 18px
    rgba(0,0,0,.35);

  font-size:
    clamp(
      1rem,
      2vw,
      1.35rem
    );

  font-weight:700;

  cursor:pointer;
}

.message-next{
  position:absolute;

  right:15px;
  bottom:9px;

  opacity:.75;

  animation:
    messageArrow
    .8s
    infinite alternate;
}

@keyframes messageArrow{
  from{
    transform:
      translateY(-2px);
  }

  to{
    transform:
      translateY(3px);
  }
}


/* =========================
   自分HUD
========================= */

.player-hud{
  position:relative;
  z-index:20;

  width:46%;

  min-height:110px;

  margin-top:-2px;

  display:grid;

  grid-template-columns:
    82px 1fr;

  gap:10px;

  padding:10px;

  background:
    linear-gradient(
      180deg,
      rgba(20,36,52,.97),
      rgba(8,21,34,.97)
    );

  border:
    2px solid
    rgba(230,245,255,.85);

  border-radius:15px;

  box-shadow:
    0 7px 18px
    rgba(0,0,0,.4);
}

.player-hud
.hud-icon,
.player-hud
.hud-icon-placeholder{
  width:82px;
  height:82px;
}


/* =========================
   コマンド
========================= */

.battle-command{
  position:relative;
  z-index:25;

  margin-top:10px;

  padding:10px;

  background:
    rgba(9,20,32,.94);

  border:
    2px solid
    rgba(190,220,245,.55);

  border-radius:16px;
}

.battle-switch{
  position:relative;
  z-index:25;

  margin-top:8px;
}


/* =========================
   エフェクト
========================= */

.effect-damage{
  animation:
    effectDamage
    .36s;
}

.effect-buff{
  animation:
    effectBuff
    .45s;
}

.effect-debuff{
  animation:
    effectDebuff
    .45s;
}

.effect-heal{
  animation:
    effectHeal
    .50s;
}

@keyframes effectDamage{

  40%{
    filter:
      sepia(1)
      saturate(8)
      hue-rotate(315deg)
      brightness(1.3);

    transform:
      translateX(-7px);
  }

  70%{
    transform:
      translateX(7px);
  }
}

@keyframes effectBuff{

  50%{
    filter:
      sepia(1)
      saturate(7)
      hue-rotate(5deg)
      brightness(1.5);
  }
}

@keyframes effectDebuff{

  50%{
    filter:
      sepia(1)
      saturate(7)
      hue-rotate(155deg)
      brightness(1.3);
  }
}

@keyframes effectHeal{

  50%{
    filter:
      sepia(1)
      saturate(6)
      hue-rotate(285deg)
      brightness(1.5);
  }
}


/* =========================
   スマホ
========================= */

@media (max-width:1000px),
       (hover:none) and (pointer:coarse){
 html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:100%;
  padding:6px;
}

#battle{
  width:100%;
  max-width:100%;
}

.battle-stage{
  width:100%;
  max-width:100%;
}
 .battle-view{
  width:100%;

  aspect-ratio:auto;
  min-height:520px;

  padding:6px;

  background-size:cover;
  background-color:#10131a;
  background-position:center;
  background-repeat:no-repeat;
}
  /* 上部 */
  .battle-header{
    margin-bottom:2px;
    font-size:.72rem;
  }

  .battle-header .btn{
    padding:5px 8px;
    font-size:.72rem;
    border-radius:8px;
  }

  /* 敵HUD */
  .enemy-hud-row{
    min-height:48px;
    gap:3px;
  }

  .enemy-hud{
    width:33%;
    min-width:0;

    display:block;

    padding:4px;

    border-width:1px;
    border-radius:8px;
  }

  .enemy-hud .hud-icon,
  .enemy-hud .hud-icon-placeholder{
    display:none;
  }

  .hud-name{
    font-size:.68rem;
    margin-bottom:2px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
.mini-stat{
  grid-template-columns:
    24px 1fr 44px;

  gap:2px;
  align-items:center;

  font-size:.55rem;
}

.mini-stat .stat-number{
  display:inline;
  font-size:.5rem;
  text-align:right;
  white-space:nowrap;
}

  .mini-stat .stat-number{
  display:inline;
  font-size:.5rem;
  white-space:nowrap;
}

  .mini-bar{
    height:5px;
  }

  /* 戦場 */
  .battle-field{
    height:220px;
    margin-top:-2px;
  }

  .player-sprite-area{
    left:1%;
    bottom:0;

    width:38%;
    height:100%;
  }

  .enemy-sprite-area{
    right:1%;
    top:4px;

    width:61%;
    height:90%;

    gap:1%;
  }

  .enemy-visual{
    width:32%;
  }

  .sprite-placeholder{
    width:48px;
    height:80px;

    border-radius:8px;
    font-size:.5rem;
  }

  .player-visual .sprite-placeholder{
    width:70px;
    height:100px;
  }

  /* メッセージ */
  .battle-message{
    min-height:58px;

    margin:
      -8px 3% 8px 28%;

    padding:
      10px 26px 10px 12px;

    border-width:2px;
    outline-width:1px;
    border-radius:8px;

    font-size:.78rem;
    line-height:1.25;
  }

  .message-next{
    right:7px;
    bottom:4px;
    font-size:.65rem;
  }

  /* 自分HUD */
  .player-hud{
    width:72%;
    min-height:72px;

    margin-top:0;

    grid-template-columns:
      46px 1fr;

    gap:6px;

    padding:6px;

    border-width:1px;
    border-radius:8px;
  }

  .player-hud .hud-icon,
  .player-hud .hud-icon-placeholder{
    width:46px;
    height:46px;

    border-radius:6px;
    font-size:.45rem;
  }

  .player-hud .hud-name{
    font-size:.68rem;
  }

  .player-hud .mini-stat{
  grid-template-columns:
    22px 1fr 44px;

  font-size:.52rem;
}

  .player-hud .small{
    font-size:.48rem;
    line-height:1.15;
  }

  /* 交代 */
  .battle-switch{
    margin-top:4px;
    padding:0 4px;
    gap:4px;
  }

  .battle-switch .btn{
    padding:6px 8px;
    font-size:.68rem;
  }

  /* コマンド */
  .battle-command{
    margin-top:4px;
    padding:6px;

    border-radius:10px;
    border-width:1px;
  }

  .move-section{
    margin-top:6px;
  }

  .move-section:first-child{
    margin-top:0;
  }

  .move-section-title{
    margin:2px 0 4px;
    padding:4px 6px;

    font-size:.68rem;
    border-radius:6px;
  }

  .move-section-grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:5px;
  }

  .move{
    min-height:46px;

    padding:7px 8px;

    font-size:.68rem;
    line-height:1.15;

    border-radius:8px;
  }

  /* キャラ選択 */
  .character-grid{
    grid-template-columns:
      1fr 1fr;
  }

  .character{
    min-height:150px;
  }

  .small{
    font-size:.72rem;
  }
}
</style>
</head>
<body>
<div class="app">

<section id="home" class="screen active">
  <div class="card">
    <h1>妖怪ウォッチ2 覇道</h1>
    <p class="small">HPまたはメンタルが0になった瞬間に脱落。ターン開始時MP回復。補正後の数値は四捨五入。</p>
    <div class="grid home-grid">
      <div class="card">
        <h2>CPと対戦</h2>
        <button class="btn primary" onclick="openMode('cpu')">ゲームモード選択</button>
      </div>
      <div class="card">
        <h2>オンライン友人戦</h2>
        <p class="small">4桁の部屋番号を使って友人とオンライン対戦できます。</p>
        <button class="btn" onclick="openOnline()">部屋メニュー</button>
      </div>
    </div>
  </div>
</section>

<section id="online" class="screen">
  <div class="card">
    <h2>オンライン友人戦</h2>
    <div class="row">
      <button class="btn primary" onclick="createRoom()">部屋を作る</button>
      <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="4桁"/>
      <button class="btn" onclick="joinRoom()">参加</button>
    </div>
    <div id="roomInfo" class="spacer"></div>
    <button class="btn" onclick="show('home')">戻る</button>
  </div>
</section>

<section id="mode" class="screen">
  <div class="card">
    <h2>ゲームモード</h2>
    <div class="grid home-grid">
      <button class="btn" onclick="setMode('duel')">タイマン</button>
      <button class="btn" onclick="setMode('team3')">3 vs 3 交代制</button>
      <button class="btn" onclick="setMode('ffa4')">乱闘</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="show('home')">戻る</button>
  </div>
</section>

<section id="select" class="screen">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2>キャラ選択</h2>
      <span id="selectGuide" class="small"></span>
    </div>
    <div id="charGrid" class="character-grid"></div>
    <div class="spacer"></div>
    <div class="row">
      <button id="startBtn" class="btn primary" onclick="startBattle()">対戦開始</button>
      <span id="readyInfo" class="small"></span>
      <button class="btn" onclick="show('mode')">戻る</button>
    </div>
  </div>
</section>

<section id="battle" class="screen">

  <div id="battleStage" class="battle-stage">

  <div id="battleView" class="battle-view">

    <!-- 上部 -->
    <div class="battle-header">

      <div>
        <b id="modeLabel"></b>
        <div id="turnLabel" class="small"></div>
      </div>

      <button
        class="btn danger"
        onclick="retire()"
      >
        退散
      </button>

    </div>

    <!-- 敵ステータス -->
    <div
      id="enemyHudRow"
      class="enemy-hud-row"
    ></div>

    <!-- キャラクター表示エリア -->
    <div class="battle-field">

      <!-- 自分 -->
      <div
        id="playerSpriteArea"
        class="player-sprite-area"
      ></div>

      <!-- 敵 -->
      <div
        id="enemySpriteArea"
        class="enemy-sprite-area"
      ></div>

    </div>

    <!-- メッセージ -->
    <div
      id="battleMessage"
      class="battle-message"
      onclick="advanceBattleMessage()"
    >
      <span id="battleMessageText">
        対戦開始！
      </span>

      <span class="message-next">
        ▼
      </span>
    </div>

  <!-- 自分ステータス -->
<div
  id="playerHud"
  class="player-hud"
></div>

<!-- 背景範囲 battleView ここまで -->
</div>

<!-- 交代 -->
<div
  id="switchRow"
  class="row battle-switch"
></div>

    <!-- コマンド -->

function isOnlineHost(){

 if(!b)return 0;

 return i>=0?i:0;
}

function sendOnline(data){
 if(socket&&socket.readyState===WebSocket.OPEN){
  socket.send(JSON.stringify(data));
 }
}

function connectOnline(){
 return new Promise((resolve,reject)=>{
  if(socket&&socket.readyState===WebSocket.OPEN)return resolve();

  const protocol=location.protocol==='https:'?'wss:':'ws:';
  socket=new WebSocket(`${protocol}//${location.host}`);

  socket.addEventListener('open',()=>resolve(),{once:true});
  socket.addEventListener('error',()=>reject(new Error('接続失敗')),{once:true});
  socket.addEventListener('message',event=>{
   try{
    handleOnlineMessage(JSON.parse(event.data));
   }catch(e){
    console.error(e);
   }
  });
 });
}

function handleOnlineMessage(data){

 if(data.type==='room_created'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋番号</p>
    <div class="room">${data.roomCode}</div>
    <p class="small">友達の参加を待っています…</p>
    <p id="onlinePlayerCount">参加人数 1人</p>`;
 }

 if(data.type==='room_joined'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋 ${data.roomCode} に参加しました。</p>
    <p id="onlinePlayerCount">参加人数を確認中…</p>
    <p class="small">部屋を作った人がモードを選びます。</p>`;

  if(data.mode&&data.mode!=='pending'){
   appState.mode=data.mode;
   appState.selected=[];
   renderSelection();
   show('select');
  }
 }

 if(data.type==='room_state'){
  onlineHostId=data.hostId;

  const el=document.getElementById('onlinePlayerCount');
  if(el)el.textContent=`参加人数 ${data.count}人`;

  if(!data.started&&data.mode==='pending'&&isOnlineHost()&&data.count>=2){
   const info=document.getElementById('roomInfo');

   if(info&&!document.getElementById('modeGoBtn')){
    info.insertAdjacentHTML(
     'beforeend',
     '<button id="modeGoBtn" class="btn primary" onclick="show(\'mode\')">ゲームモード選択へ</button>'
    );
   }
  }
 }

 if(data.type==='mode_set'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  appState.selected=[];
  renderSelection();
  show('select');
 }

 if(data.type==='ready_state'){
  const ri=document.getElementById('readyInfo');

  if(ri){
   ri.textContent=`準備完了 ${data.readyCount}/${data.total}`;
  }

  const me=data.players?.find(p=>p.id===onlinePlayerId);
  const btn=document.getElementById('startBtn');

  if(btn&&me?.ready){
   btn.disabled=true;
   btn.textContent='準備完了済み';
  }
 }

 if(data.type==='battle_start'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  onlineWaitingAction=false;

   buildOnlineBattle(data.players,data.mode);
  show('battle');

  startBattleBgm();

  if(isOnlineHost()){
   beginTurn();
   broadcastBattleState();
  }else{
   document.getElementById('moves').innerHTML=
    '<button class="btn" disabled>対戦開始を同期中…</button>';
  }
 }

 if(data.type==='action_selected'){
  const tl=document.getElementById('turnLabel');

  if(tl&&appState.battle){
   tl.textContent=
    `ターン ${appState.battle.turn}　行動待ち ${data.selectedCount}/${data.total}`;
  }
 }

 if(
  data.type==='all_actions_selected' &&
  isOnlineHost() &&
  appState.battle &&
  !appState.battle.finished
 ){
  runOnlineTurn(data.actions);
  broadcastBattleState();
 }

 if(data.type==='battle_state'){
  appState.battle=data.battle;
  onlineWaitingAction=false;

  show('battle');
  renderBattle();

  if(appState.battle.finished){
   showOnlineResult();
   return;
  }

  maybeAutoOnlineAction();
 }

 if(data.type==='player_left'){
  alert('参加者が退出しました。');
 }

 if(data.type==='error'){
  alert(data.message);
 }
}

function attachTip(el,text){

 let timer;
 const tip=document.getElementById('tooltip');

 el.addEventListener('mouseenter',e=>{
  if(matchMedia('(hover:hover)').matches){
   tip.textContent=text;
   tip.style.display='block';
   moveTip(e);
  }
 });

 el.addEventListener('mousemove',moveTip);

 el.addEventListener('mouseleave',()=>{
  tip.style.display='none';
 });

 el.addEventListener('touchstart',()=>{
  timer=setTimeout(()=>{
   tip.textContent=text;
   tip.style.left='12px';
   tip.style.bottom='12px';
   tip.style.top='auto';
   tip.style.display='block';
  },450);
 },{passive:true});

 el.addEventListener('touchend',()=>{
  clearTimeout(timer);
  setTimeout(()=>{
   tip.style.display='none';
  },700);
 });
}

function moveTip(e){
 const tip=document.getElementById('tooltip');

 tip.style.left=
  Math.min(innerWidth-370,e.clientX+15)+'px';

 tip.style.top=
  Math.min(innerHeight-220,e.clientY+15)+'px';
}

function startBattle(){

 const need=
  appState.mode==='team3'?3:1;

 if(appState.selected.length<need){
  return alert(`キャラを${need}人選択してください。`);
 }

 if(appState.connection==='friend'){

  sendOnline({
   type:'ready',

  const b=
   document.getElementById('startBtn');

  if(b){
   b.disabled=true;
   b.textContent='準備完了済み';
  }

  const ri=
   document.getElementById('readyInfo');

  if(ri){
   ri.textContent=
    'ほかの参加者を待っています…';
  }

  return;
 }

 const used=
  new Set(appState.selected);

 const pool=
  chars
   .map((_,i)=>i)
   .filter(i=>!used.has(i));

 shuffle(pool);

 let b={
  turn:1,
  mode:appState.mode,
  teams:[],
  active:[0,0],
  log:[],
  finished:false
 };

 if(appState.mode==='duel'){

  b.teams=[
   [

     chars[appState.selected[0]],
     0
    )
   ],
   [
    cloneFighter(
     chars[pool[0]],
     1

   ]

 }else if(appState.mode==='team3'){

  b.teams=[
   appState.selected.map(
    (i,j)=>cloneFighter(chars[i],0,j)
   ),
   pool.slice(0,3).map(
    (i,j)=>cloneFighter(chars[i],1,j)
   )
  ];

 }else{

function runOnlineTurn(actions){

 const b=appState.battle;

 if(!b||b.finished){
  return;
 }

 const acts=[];

 for(
  let s=0;
  s<b.teams.length;
  s++
 ){
  const f=activeF(s);

  if(!f||!f.alive){
   continue;
  }

  const a=
   actions[f.ownerId]||
   {type:'none'};

  acts.push({f,a});
 }

 prepareTurnActions(acts);

acts=sortTurnActions(acts);
 for(const x of acts){

  if(!x.f.alive){
   continue;
  }

  let targets=
 livingEnemies(x.f);
 

  executeAction(
   x.f,
   x.a,
   targets
  );

  checkDeaths();

  if(b.finished){
   break;
  }
 }

 if(!b.finished){
  endTurn();
 }
}

function shuffle(a){
 for(
  let i=a.length-1;
  i>0;
  i--
 ){
  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}

function activeF(side){
 const b=appState.battle;
 return b.teams[side][b.active[side]||0];
}

function allActive(){
 const b=appState.battle;

 return b.teams
  .map(
   (t,i)=>t[b.active[i]||0]
  )
  .filter(Boolean);
}

function livingEnemies(f){

 return allActive().filter(
  t=>
   t &&
   t!==f &&
   t.alive &&
   t.hp>0 &&
   t.mental>0 &&
   t.side!==f.side
 );
}

function randomLivingEnemy(f){

 const enemies=
  livingEnemies(f);

 if(!enemies.length){
  return null;
 }

 return enemies[
  Math.floor(
   Math.random()*enemies.length
  )
 ];
}

function beginTurn(){

 const b=appState.battle;

 if(b.finished){
  return;
 }

 allActive().forEach(f=>{

  if(!f.alive){
   return;
  }

  let regen=
   1+
   (
    f.traits.includes('めんざいたいしつ')
     ?1
     :0
   );

  f.mp=
   Math.min(
    f.maxMp,
    f.mp+regen
   );

  if(f.traits.includes('むしば')){
   directDamage(
    f,
    2,
    2,
    'むしば'
   );
  }

  if(
   f.traits.includes('じあいのこころ')
  ){
   f.mental=
    Math.min(
     f.maxMental,
     f.mental+5
    );
  }

   if(f.haruka){

 f.mental=
  Math.min(
   f.maxMental,
   f.mental+5
  );
}

  if(
   f.traits.includes('ちゅうそつのいでんし') &&
   Math.random()<P.normal
  ){
   f.hp=
    Math.min(
     f.maxHp,
     f.hp+5
    );
  }

  if(
   f.traits.includes('できん')
  ){
   f.mentalBuff*=1.2;
  }

// にじゅうじんかく
f.dualPhysical = 1;
f.dualMental = 1;

if(f.traits.includes('にじゅうじんかく')){
  if(Math.random() < 0.5){
    f.dualPhysical = 1.2;
    f.dualMental = 0.7;
  }else{
    f.dualPhysical = 0.7;
    f.dualMental = 1.2;
  }
}
   
 if(
 f.traits.includes('むげん成長')
){
 f.growthP*=1.08;
 f.growthM*=1.08;

 f.maxHp-=4;
 f.hp=Math.min(f.hp,f.maxHp);

 f.maxMp+=1;
}

  if(f.verbalDot>0){
   directDamage(
    f,
    0,
    5*f.verbalDot,
    'ばとう'
   );
  }
   if(f.parasiteStacks>0){

 directDamage(
  f,
  5*f.parasiteStacks,
  5*f.parasiteStacks,
  `きせい×${f.parasiteStacks}`
 );
}
 });
  

 applyGlobalStart();
 checkDeaths();
 renderBattle();
 log(`--- ターン ${b.turn} ---`);

 if(
  !b.finished &&
  appState.connection==='cpu' &&
  activeF(0)?.swimming
 ){
  setTimeout(()=>{
   const cur=
    appState.battle;

   if(
    cur &&
    !cur.finished &&
    activeF(0)?.swimming
   ){
    runTurn({type:'none'});
   }
  },0);
 }

 if(
  !b.finished &&
  appState.connection==='friend'
 ){
  maybeAutoOnlineAction();
 }
}

function applyGlobalStart(){

 const acts=allActive();

 for(const src of acts){

  if(src.traits.includes('あくしゅう')){

   for(const t of acts){

    if(t!==src&&t.alive){
    applyDamage(
 src,
 t,
 {
  mental:2,
  tags:['におい']
 },
 true
);
    }
   }
  }
 }

 for(const src of acts){

  if(src.traits.includes('うわきしょう')){

   const women=
    acts.filter(
     x=>
      x!==src &&
      x.races.includes('おんな') &&
      x.alive
    );

   for(const w of women){

    const take=
     Math.min(5,w.mp);

    w.mp-=take;

    src.mp=
     Math.min(
      src.maxMp,
      src.mp+take
     );
   }

   if(
    women.length &&
    Math.random()<P.normal
   ){
    if(Math.random()<.5){
     src.hp-=5*women.length;
    }else{
     src.mental-=5*women.length;
    }
   }
  }
 }
}

 battleMessageQueue=[];

 battleMessagePlaying=false;

 queuedBattleLogCount=0;

pendingBattleResult=null;

 if(battleMessageTimer){

  clearTimeout(
   battleMessageTimer
  );

  battleMessageTimer=null;

function syncBattleMessages(){

 const b=
  appState.battle;

 if(!b){
  return;
 }

 if(
  b.log.length<
  queuedBattleLogCount
 ){
  queuedBattleLogCount=0;
 }

 while(
 queuedBattleLogCount<
 b.log.length
){

 battleMessageQueue.push(
  b.log[
   queuedBattleLogCount
  ]
 );

 queuedBattleLogCount++;
}

 if(
  !battleMessagePlaying
 ){
  showNextBattleMessage();
 }
}


function showNextBattleMessage(){

 if(
  !battleMessageQueue.length
 ){

  battleMessagePlaying=false;

  battleMessageTimer=null;

  /*
   戦闘終了済みなら
   最後のメッセージを読み終わった後に
   結果画面へ移動
  */
  if(
   pendingBattleResult
  ){

   const result=
    pendingBattleResult;

   pendingBattleResult=null;

   document.getElementById(
    'resultText'
   ).textContent=
    result.text;

   sfx(
    result.text==='勝利'
     ?660
     :180,
    .18
   );

   show('result');

   return;
  }

  renderMoves();

  return;
 }

 battleMessagePlaying=true;

 const message=
 battleMessageQueue.shift();

const box=
 document.getElementById(
  'battleMessageText'
 );

if(box){

 box.textContent=
  typeof message==='string'
   ?message
   :message.text;
}


/* メッセージ表示と同時に演出 */

if(
 typeof message==='object'
){

 if(
  message.effect!==null &&
  message.side!==null
 ){

  const fighter=
   allActive().find(
    f=>f.side===message.side
   );

  if(fighter){

   animateF(
    fighter,
    message.effect
   );
  }
 }

 if(message.sound){

  playBattleSound(
   message.sound
  );
 }
}
 if(battleMessageTimer){

  clearTimeout(
   battleMessageTimer
  );
 }

/*
 戦闘終了後の最後のメッセージは
 自動送りしない。
 プレイヤーのクリックを待つ。
*/
if(
 pendingBattleResult &&
 battleMessageQueue.length===0
){
 battleMessageTimer=null;
 return;
}

battleMessageTimer=
 setTimeout(
  ()=>{
   battleMessagePlaying=false;
   showNextBattleMessage();
  },
  2800
 );
}


function advanceBattleMessage(){

 if(battleMessageTimer){

  clearTimeout(
   battleMessageTimer
  );

  battleMessageTimer=null;
 }

 battleMessagePlaying=false;

 showNextBattleMessage();
}

function moveNeedsTarget(m){

 // 全体攻撃は選択不要
 if(m.allTargets){
  return false;
 }

 // 自分だけに作用する技
 if(
  m.priorityGuard ||
  m.special==='dodge' ||
  m.special==='skip' ||
  m.special==='gundam' ||
  m.special==='haruka' ||
  m.special==='rampage' ||
  m.special==='mentalResistStack' ||
  m.special==='invest' ||
  m.special==='swim' ||
  m.special==='dogGuard' ||
  m.special==='wrapHair' ||
  m.special==='halalFood'
 ){
  return false;
 }

 // 通常攻撃・精神攻撃・相手対象特殊技
 // えんげきもここに含まれる
 return (
  m.physical ||
  m.mental ||
  m.multi ||
  m.special==='copy' ||
  m.special==='parasite' ||
  m.special==='removeMask' ||
  m.special==='verbalDot' ||
  m.special==='entangle' ||
  m.special==='stealMp' ||
  m.special==='gamble' ||
  m.special==='affair' ||
  m.special==='seiri' ||
  m.special==='lost' ||
  m.special==='poop' ||

function shuffleTurnGroup(group){

 const a=[...group];

 for(let i=a.length-1;i>0;i--){

  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}


function sortTurnActions(acts){

 // priorityScoreごとに分類
 const groups=new Map();

 for(const x of acts){

  const p=
   priorityScore(x);

  if(!groups.has(p)){
   groups.set(p,[]);
  }

  groups.get(p).push(x);
 }

 // 優先度が高い順
 const priorities=
  [...groups.keys()]
   .sort((a,b)=>b-a);

 const result=[];

 for(const p of priorities){

  let group=
   groups.get(p);

  // 1人ならそのまま
  if(group.length<=1){

   result.push(...group);

   continue;
  }

  // まず通常キャラをランダムに並べる
  const normal=
   shuffleTurnGroup(
    group.filter(
     x=>
      (x.f.entangled||0)<=0
    )
   );

  // からみつかれているキャラ
  const entangled=
   shuffleTurnGroup(
    group.filter(
     x=>
      (x.f.entangled||0)>0
    )
   );

  /*
   からみつきがいない場合は
   普通のランダム順
  */
  if(!entangled.length){

   result.push(
    ...shuffleTurnGroup(group)
   );

   continue;
  }

  /*
   2人だけの場合

   からみつかれた側：
   20%で先行
   80%で後攻
  */
  if(
   group.length===2 &&
   entangled.length===1
  ){

   const e=
    entangled[0];

   const n=
    normal[0];

   if(Math.random()<0.2){

    result.push(
     e,
     n
    );

   }else{

    result.push(
     n,
     e
    );
   }

   continue;
  }

  /*
   乱闘など3人以上。

   からみつかれたキャラを
   1人ずつ配置する。
  */
  let ordered=[
   ...normal
  ];

  for(const e of entangled){

   if(ordered.length===0){

    ordered.push(e);

    continue;
   }

   if(Math.random()<0.8){

    // 80%で最後
    ordered.push(e);

   }else{

    /*
     残り20%では
     「最後以外」の位置を均等抽選
    */

    const position=
     Math.floor(
      Math.random()*
      ordered.length
     );

    ordered.splice(
     position,
     0,
     e
    );
   }
  }

  result.push(
   ...ordered
  );
 }

 return result;
}

   Math.random()<.5
    ?5
    :-5;
 }

if(m.buffPhysicalNext){

 f.physicalBuff*=
  m.buffPhysicalNext;

 log(
  `${f.name}の物理攻撃力が上がった！`,

  f.side,
  'buff'
 );
}
if(m.buffMentalNext){

 f.mentalBuff*=

 log(
  `${f.name}の精神攻撃力が上がった！`,

  f.side,
  'buff'
 );
}

if(
 m.debuffEnemyMentalAtk &&
 targets[0]
){

 targets[0].nextM*=

 log(
  `${targets[0].name}の精神攻撃力が下がった！`,

 );

/* executeMoveEffect終了 */
}

 if(

  );

 return c;

function applyDamage(
 src,
 t,
 m,
 passive=false
){

 if(!t||!t.alive){
  return;
 }

 if(
  t.dodging &&
  !passive &&
  (
   m.physical ||
   m.mental
  )
 ){
  log(
   `${t.name}は攻撃をよけた！`
  );

  animateF(
   t,
   'flash'
  );

  return;
 }

 if(
  (
   t.traits.includes('えんきんほう') ||
   t.traits.includes('おやのななひかり')
  ) &&
  m.physical &&
  Math.random()<P.evasion
 ){

  log(
   `${t.name}は物理攻撃を回避`
  );

  m={
   ...m,
   physical:0
  };
 }

 let p=m.physical||0;
 let q=m.mental||0;

 const tags=
  m.tags||[];

 if(p){

  p*=src.nextP||1;
  p*=src.physicalBuff||1;
  p*=src.growthP||1;
p*=src.dualPhysical||1;
  if(
   src.traits.includes('うんどうおんち')
  ){
   p*=.7;
  }

  if(
   src.traits.includes('きょたい')
  ){
   p*=1.2;
  }

  if(
   src.traits.includes('きけんしそう')
  ){

   p*=1.1;

   if(
    t.races.includes('もじゃもじゃ')
   ){
    p/=1.1;
    p*=1.2;
   }

   if(
    t.races.includes('デブ')
   ){
    p/=1.1;
    p*=1.4;
   }
  }

  if(
   src.traits.includes('かりめん')
  ){
   p+=20;
  }

  if(
   src.traits.includes('あかいろ') &&
   tags.includes('いろ')
  ){
   p*=1.2;
  }

  if(
   src.traits.includes('あるくTDL') &&
   tags.includes('おと')
  ){
   p*=1.5;
  }

  if(
   src.traits.includes('ユーチューバー') &&
   (
    tags.includes('いろ') ||
    tags.includes('おと')
   )
  ){
   p*=1.2;
  }

   if(
 src.haruka &&
 tags.includes('おと')
){
 p*=2;
}
   
  if(
   src.traits.includes('じゅんあい') &&
   t.traits.includes('うわきしょう')
  ){
   p*=1.5;
  }

  if(src.rampage>0){
   p*=2;
  }
 }

 if(q){

  q*=src.nextM||1;
  q*=src.mentalBuff||1;
  q*=src.growthM||1;
  q*=src.halalMentalMul||1;
   q*=src.dualMental||1;

  if(
   src.traits.includes('ふきんしん')
  ){
   q*=1.3;
  }

  if(
   src.traits.includes('れいしょうけい')
  ){
   q*=1.1;
  }

  if(
   src.traits.includes('ぼうず')
  ){
   q*=.75;
  }

  if(
   src.traits.includes('どくぜつ')
  ){

   q*=
    t.races.some(
     r=>
      [
       'fラン',
       'ろうにん',
       'ろうにんせい',
       'たんきだいがく'
      ].includes(r)
    )
     ?1.5
     :1.1;
  }

  if(
   src.traits.includes('じゅんあい') &&
   t.traits.includes('うわきしょう')
  ){
   q*=1.5;
  }

  if(
   src.traits.includes('ユーチューバー') &&
   (
    tags.includes('いろ') ||
    tags.includes('おと')
   )
  ){
   q*=1.2;
  }
 }

  if(
 src.haruka &&
 tags.includes('おと')
){
 q*=2;
}

 if(
  tags.includes('いろ') &&
  t.traits.includes('ひかりのヴェール')
 ){
  p*=.5;
  q*=.5;
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('しきもう')
 ){
  p=0;
  q=0;
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('しらが')
 ){
  p*=.8;
  q*=.8;
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('くろいろ')
 ){
  p*=1.5;
  q*=1.5;

  directDamage(
   src,
   10,
   0,
   'くろいろ反撃'
  );
 }

 if(
  t.traits.includes('ボケ') &&
  (
   tags.includes('いろ') ||
   tags.includes('おと') ||
   tags.includes('におい')
  )
 ){
  p*=.75;
  q*=.75;
 }

 if(
  t.traits.includes('無神経')
 ){
  p*=.8;
 }

 if(
  t.traits.includes('きょたい')
 ){
  p*=1.2;
 }

 if(
  t.traits.includes('めめしい')
 ){
  q*=1.2;
 }

 if(
  t.traits.includes('わがまま')
 ){
  q*=.5;
 }

 if(
  t.traits.includes('なぞのこうい') &&
  src.races.includes('おんな')
 ){
  q*=1.2;
 }

 if(
  t.traits.includes('いぬけい') &&
  src.races.includes('おんな')
 ){
  p*=.5;
 }

 if(
  t.traits.includes('びびり') &&
  (
   tags.includes('しんれい') ||
   tags.includes('びっくり')
  )
 ){
  p*=1.5;
  q*=1.5;
 }

 if(t.mentalResistStacks){

  q*=
   Math.pow(
    .7,
    t.mentalResistStacks
   );
 }

 if(
  t.traits.includes('しきもう') &&
  p &&
  Math.random()<P.normal
 ){
  p*=1.2;
 }

 if(
  t.traits.includes('まゆなし')
 ){
  p*=.9;
 }

 let ignoranceReduction=
  t.traits.includes('むちのヴェール')
   ?10
   :0;

 ignoranceReduction+=
  t.veilBoost||0;

 if(ignoranceReduction>0){

  p=
   Math.max(
    0,
    p-ignoranceReduction
   );

  q=
   Math.max(
    0,
    q-ignoranceReduction
   );
 }

 p=
  Math.round(
   Math.max(
    0,
    p-(t.guard||0)
   )
  );

 q=
  Math.round(
   Math.max(
    0,
    q-(t.guard||0)
   )
  );

 directDamage(
  t,
  p,
  q,
  src.name
 );

 if(!(p||q)){

 animateF(
  t,
  'flash'
 );
}

 if(
  src.traits.includes('かりめん') &&
  Math.random()<P.accident
 ){
  directDamage(
   src,
   20,
   0,
   'かりめん反動'
  );
 }
}
function directDamage(
 t,
 p,
 q,
 why
){

 t.hp-=
  Math.round(
   p||0
  );

 t.mental-=
  Math.round(
   q||0
  );

 if(
  (p||q)&&
  why
 ){

  log(
   `${t.name}に`+
   `${p
     ?` HP-${Math.round(p)}`
     :''
   }`+
   `${q
     ?` 精神-${Math.round(q)}`
     :''
   }`+
   ` (${why})`,
  'damage',
   t.side,
   'damage'
  );
 }
}
  

function animateF(
 f,
 type
){

 const e=
  document.getElementById(
   'fighter-'+f.side
  );

 if(!e){
  return;
 }

 const map={

  damage:
   'effect-damage',

  buff:
   'effect-buff',

  debuff:
   'effect-debuff',

  heal:
   'effect-heal',

  flash:
   'effect-buff',

  shake:
   'effect-damage'
 };

 const cl=
  map[type]||
  type;

 e.classList.remove(
  cl
 );

 void e.offsetWidth;

 e.classList.add(
  cl
 );

 setTimeout(
  ()=>{
   e.classList.remove(
    cl
   );
  },
  550
 );
}

 if(!b){

 for(const team of b.teams){

 const b=
  appState.battle;

 if(b.finished){
  return;
 }

 for(const f of allActive()){

if(f.gundam){

 const t=
  randomLivingEnemy(f);

 if(t){

  applyDamage(
   f,

   {physical:10}
  );
 }
}

  if(f.swimming){

   f.swimming--;

   if(f.swimming===0){

 randomLivingEnemy(f);

if(t){

 applyDamage(

 );
}
   }
  }

  }

f.nextP=1;
f.nextM=1;

f.plannedAction=null;
 }

/* ターン終了時に表示ゲージを実際の値へ同期 */
syncDisplayedStats();
for(const team of b.teams){
 for(const f of team){
  f.displayHp=f.hp;

 }
}

 return;
}

b.turn++;
beginTurn();
}

function checkDeaths(){

 const b=
  appState.battle;

 for(
  let s=0;
  s<b.teams.length;
  s++
 ){

  const f=
   activeF(s);
   
  applyUniqueFaith(f);

  if(
   f &&
   f.alive &&
   (
    f.hp<=0 ||
    f.mental<=0
   )
  ){

   f.alive=false;
   f.hp=Math.max(0,f.hp);
   f.mental=Math.max(0,f.mental);
    f.displayHp=f.hp;
f.displayMental=f.mental;

   if(f.hp<=0){

 log(
  `${f.name}の体力は0になった！`,
  'damage',
  f.side,
  null
 );
}

if(f.mental<=0){

 log(
  `${f.name}の精神は0になった！`,
  'damage',
  f.side,
  null
 );
}

log(
 `${f.name}は倒れた。`
);

   if(f.gundam){
    f.gundam=false;
   }

  if(f.haruka){
 f.haruka=false;
}

   if(b.mode==='team3'){

    const ni=
     b.teams[s]
      .findIndex(
       x=>x.alive
      );

    if(ni>=0){

     b.active[s]=ni;

     log(
      `${b.teams[s][ni].name}が場に出た`
     );
    }
   }
  }
 }

 if(
  appState.connection==='friend'
 ){

  const aliveSides=
   b.teams
    .map(
     (t,s)=>
      t.some(x=>x.alive)
       ?s
       :-1
    )
    .filter(
     s=>s>=0
    );

  if(aliveSides.length<=1){

   const winner=
    aliveSides.length
     ?b.teams[aliveSides[0]][0].ownerId
     :null;

   finish(
    winner===onlinePlayerId
     ?'勝利'
     :'敗北',
    winner
   );
  }

 }else if(
  b.mode==='ffa4'
 ){

  const alive=
   allActive()
    .filter(
     x=>x.alive
    );

  if(alive.length<=1){

   finish(
    alive[0]?.side===0
     ?'勝利'
     :'敗北'
   );
  }

 }else{

  const a=
   b.teams[0]
    .some(
     x=>x.alive
    );

  const c=
   b.teams[1]
    .some(
     x=>x.alive
    );

  if(!a||!c){

   finish(
    a
     ?'勝利'
     :'敗北'
   );
  }
 }
}

  !f.traits.includes(

function sfx(freq=330,dur=.05){

 try{

  const A=
   window.AudioContext||
   window.webkitAudioContext;

  const c=
   sfx.ctx||
   (
    sfx.ctx=
     new A()
   );

  const o=
   c.createOscillator();

  const g=
   c.createGain();

  o.frequency.value=
   freq;

  g.gain.value=
   .025;

  o.connect(g);
  g.connect(
   c.destination
  );

  o.start();

  g.gain.exponentialRampToValueAtTime(
   .0001,
   c.currentTime+dur
  );

  o.stop(
   c.currentTime+dur
  );

 }catch(e){}
}
