<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>対戦ゲーム</title>
<style>
:root{
  --bg:#10131a;--panel:#1b2030;--panel2:#242b3d;--text:#f4f7fb;--muted:#aeb7c7;--accent:#6fd3ff;--danger:#ff6b7a;--good:#77e08f;--gold:#ffd76f;
}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#1b2337,#0d1016 55%);color:var(--text);min-height:100vh}
button,select,input{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
h1,h2,h3{margin:.2em 0 .65em}.grid{display:grid;gap:14px}.home-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.btn{border:0;border-radius:13px;padding:12px 15px;background:#2e3850;color:#fff;cursor:pointer;transition:.15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.btn:hover{transform:translateY(-1px);background:#3a4663}.btn.primary{background:#267ea2}.btn.danger{background:#8b3340}.btn.good{background:#2d7a47}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.small{font-size:.9rem;color:var(--muted)}
.character-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.character{position:relative;cursor:pointer;min-height:185px}.character.selected{outline:3px solid var(--accent)}.tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#30384a;margin:2px;font-size:.78rem;color:#dce5f4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.stat{background:#111725;border-radius:10px;padding:7px;text-align:center}.tooltip{position:fixed;z-index:20;max-width:360px;background:#06080d;border:1px solid rgba(255,255,255,.2);padding:12px;border-radius:12px;display:none;white-space:pre-wrap;font-size:.9rem;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.battle-top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.fighters{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}.fighter{background:#171d2a;border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.1)}.fighter.enemy{transform-origin:center}.name{font-size:1.2rem;font-weight:700}.bar{height:16px;background:#0a0d12;border-radius:99px;overflow:hidden;margin:4px 0 8px}.fill{height:100%;transition:width .35s}.hp{background:linear-gradient(90deg,#30bd66,#80e59c)}.mental{background:linear-gradient(90deg,#8d64e8,#c695ff)}.mp{background:linear-gradient(90deg,#3d9cdb,#77d0ff)}.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;margin-top:14px}.move{min-height:64px;text-align:left}.log{height:260px;overflow:auto;background:#090c12;border-radius:14px;padding:12px;font-size:.94rem;line-height:1.5}.flash{animation:flash .35s}.shake{animation:shake .28s}.heal{animation:heal .55s}@keyframes flash{50%{filter:brightness(2)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes heal{50%{box-shadow:0 0 25px #6dff9c}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{height:8px}.hidden{display:none!important}.result{font-size:1.5rem;font-weight:800;text-align:center;padding:18px}.room{font-size:2rem;letter-spacing:.25em;font-weight:800;color:var(--gold)}
@media(max-width:700px){.fighters{grid-template-columns:1fr}.log{height:190px}.app{padding:10px}.moves{grid-template-columns:1fr 1fr}.btn{padding:11px}.character-grid{grid-template-columns:1fr 1fr}.character{min-height:160px}.small{font-size:.82rem}}
</style>
</head>
<body>
<div class="app">

<section id="home" class="screen active">
  <div class="card">
    <h1>対戦ゲーム</h1>
    <p class="small">HPまたはメンタルが0になった瞬間に脱落。ターン開始時MP回復。補正後の数値は四捨五入。</p>
    <div class="grid home-grid">
      <div class="card">
        <h2>CPと対戦</h2>
        <button class="btn primary" onclick="openMode('cpu')">ゲームモード選択</button>
      </div>
      <div class="card">
        <h2>オンライン友人戦</h2>
        <p class="small">4桁の部屋番号を使って友人とオンライン対戦できます。</p>
        <button class="btn" onclick="openOnline()">部屋メニュー</button>
      </div>
    </div>
  </div>
</section>

<section id="online" class="screen">
  <div class="card">
    <h2>オンライン友人戦</h2>
    <div class="row">
      <button class="btn primary" onclick="createRoom()">部屋を作る</button>
      <input id="roomInput" maxlength="4" inputmode="numeric" placeholder="4桁"/>
      <button class="btn" onclick="joinRoom()">参加</button>
    </div>
    <div id="roomInfo" class="spacer"></div>
    <button class="btn" onclick="show('home')">戻る</button>
  </div>
</section>

<section id="mode" class="screen">
  <div class="card">
    <h2>ゲームモード</h2>
    <div class="grid home-grid">
      <button class="btn" onclick="setMode('duel')">タイマン</button>
      <button class="btn" onclick="setMode('team3')">3 vs 3 交代制</button>
      <button class="btn" onclick="setMode('ffa4')">乱闘</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="show('home')">戻る</button>
  </div>
</section>

<section id="select" class="screen">
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2>キャラ選択</h2>
      <span id="selectGuide" class="small"></span>
    </div>
    <div id="charGrid" class="character-grid"></div>
    <div class="spacer"></div>
    <div class="row">
      <button id="startBtn" class="btn primary" onclick="startBattle()">対戦開始</button>
      <span id="readyInfo" class="small"></span>
      <button class="btn" onclick="show('mode')">戻る</button>
    </div>
  </div>
</section>

<section id="battle" class="screen">
  <div class="card">
    <div class="battle-top">
      <div>
        <b id="modeLabel"></b>
        <div class="small" id="turnLabel"></div>
      </div>
      <div class="row">
        <button class="btn danger" onclick="retire()">退散</button>
      </div>
    </div>
    <div id="fighters" class="fighters"></div>
    <div class="row" id="switchRow"></div>
    <div id="moves" class="moves"></div>
    <h3>ログ</h3>
    <div id="log" class="log"></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="card">
    <div id="resultText" class="result"></div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" onclick="rematch()">もういちど</button>
      <button class="btn" onclick="backToSelect()">キャラ選択に戻る</button>
      <button class="btn" onclick="show('home')">ホームに戻る</button>
    </div>
  </div>
</section>

</div>

<div id="tooltip" class="tooltip"></div>

<script>
const P={normal:.5,low:.25,evasion:.25,accident:.25};

const commonMoves={
 'なぐる':{physical:5},
 'わるぐち':{mental:5},
 'わるだくみ':{mp:1,buffMentalNext:1.2},
 'やすむ':{mp:1,healHp:10,healMental:10},
 '防御':{guard:10,priorityGuard:true}
};

const moveBook={
 'れいしょう':{mp:0,mpGain:1,mental:5,tags:['しんれい']},
 'しんれいげんしょう':{mp:2,mental:15,tags:['しんれい']},
 'おえかき':{mpGain:1,mental:5,tags:['いろ']},
 'べんきょう':{mpGain:2,selfHp:-5,selfMental:-5},
 'いんしゅ':{mpGain:1,selfHp:-5,randomMentalDrink:true},
 'おおごえ':{mp:2,physical:15,mental:5,tags:['おと']},
 'からて':{mp:3,physical:30,buffPhysicalNext:1.2},
 'たどうしょう':{mp:1,buffPhysicalNext:1.1},
 'きつえん':{mp:1,selfHp:-5,healMental:10},
 'ちーといつ':{mp:1,multi:[2,2.2,2.42,2.662,2.9282,3.22102,3.543122]},
 '投資':{special:'invest'},
 'とうし':{special:'invest'},
 'ギャンブル':{mp:3,special:'gamble'},
 'ぎゃんぶる':{mp:3,special:'gamble'},
 'さっかー':{mp:1,physical:10},
 'ラップ':{mp:1,buffPhysicalNext:1.1},
 'タックル':{mp:2,physical:30,selfHp:-10},
 'たっくる':{mp:2,physical:30,selfHp:-10},
 'えんそう':{debuffEnemyMentalAtk:.8},
};

const chars=[
{name:'KK',hp:70,mental:110,mp:10,races:['びびゅつか','ゆうれいぶいん'],traits:['しきもう','ふきんしん','なぞのこうい','じーぴーえー','うんどうおんち'],moves:{'ガンダム':{mp:8,special:'gundam'},'みつぞうしゅ':{healHp:20},'たけやまバズーカ':{mp:2,physical:20,priority:true},...pick(['れいしょう','わるだくみ','しんれいげんしょう','おえかき','べんきょう','いんしゅ'])}},
{name:'あさと',hp:120,mental:80,mp:8,races:['ひばくしゃ','ろうにんせい'],traits:['おおごえ','無神経','むげん成長','ぼうず','びびり','まゆなし'],moves:{'ピカドンボイス':{mp:7,physical:50,mental:10,selfHp:-10,tags:['おと']},'ろうにんせいかつ':{mp:1,healHp:10,mpGain:3,selfMental:-5},...pick(['からて','おおごえ','れいしょう','たどうしょう','べんきょう'])}},
{name:'うい',hp:110,mental:110,mp:9,races:['きつえんしゃ'],traits:['うわきしょう','だんそんじょひ','れいしょうけい'],moves:{'うわき':{mp:3,special:'affair'},...pick(['おおごえ','やすむ','からて','れいしょう','たどうしょう','べんきょう','きつえん','いんしゅ','わるだくみ','ちーといつ'])}},
{name:'みまや',hp:115,mental:95,mp:8,races:['うまづら','きつえんしゃ','たんきだいがく'],traits:['うわきしょう','ギャンブラー','えんきんほう','めめしい'],moves:{'あばれうま':{special:'rampage'},...pick(['たどうしょう','おおごえ','きつえん','いんしゅ','投資','ギャンブル'])}},
{name:'ゆうま',hp:110,mental:100,mp:7,races:['ろうじん','あるちゅう'],traits:['ボケ','ギャンブラー','しらが','あかいろ','むしば','あるつはいまー'],moves:{'ペンキばくはつ':{mp:3,physical:5,mental:50,tags:['いろ'],allTargets:true},'せいり':{mp:5,special:'seiri'},...pick(['いんしゅ','とうし','ぎゃんぶる','べんきょう','おえかき','さっかー'])}},
{name:'れんたろう',hp:110,mental:90,mp:6,races:['おんがくか','fラン'],traits:['わがまま','おやのななひかり','くろいろ','じゅんあい'],moves:{'どくそう':{mp:2,physical:10,mental:20,tags:['おと']},'まいご':{special:'lost'},'ついんぶらっく':{mp:1,multi:[10,10],tags:['いろ']},...pick(['たどうしょう','おおごえ','さっかー','えんそう'])}},
{name:'まっすー',hp:90,mental:90,mp:9,races:['もじゃもじゃ'],traits:['どくぜつ','びびり','ちゅうそつのいでんし','にじゅうじんかく'],moves:{'きれる':{mp:5,buffPhysicalNext:1.5,buffMentalNext:1.5},'ばとう':{mp:3,special:'verbalDot'},'からみつく':{mp:2,special:'entangle'},...pick(['れいしょう','べんきょう','ギャンブル'])}},
{name:'まさや',hp:100,mental:110,mp:5,races:['デブ','らぐびーぶ'],traits:['ごうまん','かりめん','あくしゅう','きょたい'],moves:{'だっぷん':{mp:4,special:'poop'},'ねんてん':{mp:1,selfHp:-50,special:'mentalResistStack'},'ばいとテロ':{mp:3,physical:10,mental:10,special:'elderDouble'},...pick(['タックル','べんきょう','ギャンブル','いんしゅ','さっかー','ラップ'])}},
{name:'さとけい',hp:100,mental:100,mp:8,races:['ふつう'],traits:['いぬけい','じんだいのかこい'],moves:{'えんげき':{mp:1,special:'copy',copyPriority:true},'いぬ':{selfMental:-10,special:'dogGuard'},...pick(['おおごえ','さっかー','べんきょう','ちーといつ','れいしょう'])}},
{name:'みやび',hp:70,mental:110,mp:6,races:['しそうか'],traits:['じゅんあい','うんどうおんち','できん','どくぜつ','だんそんじょひ','きけんしそう'],moves:{'ゆかぺろ':{selfHp:-10,buffPhysicalNext:1.2},'けんびきょう':{special:'stealMp'},'おちゃたて':{healMental:10},...pick(['べんきょう','とうし','ラップ','れいしょう','わるだくみ','タックル'])}},
{name:'むっちゃん',hp:120,mental:110,mp:6,races:['おんな','でぶ','びびゅつか'],traits:['じあいのこころ','きょたい','ごうまん','ユーチューバー'],moves:{'すいみんぐ':{mp:4,special:'swim'},'かいご':{mp:2,healMental:30},'たたきおこす':{mp:3,physical:40,special:'wakeMp'},...pick(['たっくる','おえかき','おおごえ','べんきょう','しんれいげんしょう'])}}
];

function pick(arr){
 const o={};
 for(const n of arr)o[n]=moveBook[n]||commonMoves[n]||{};
 return o;
}

let appState={
 connection:'cpu',
 mode:'duel',
 selected:[],
 battle:null,
 lastSetup:null
};

function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function openMode(c){
 appState.connection=c;
 show('mode');
}

function openOnline(){
 show('online');
}

let socket=null;
let onlinePlayerId=null;
let onlineRoomCode=null;
let onlineHostId=null;
let onlineWaitingAction=false;

function isOnlineHost(){
 return appState.connection==='friend'&&onlinePlayerId===onlineHostId;
}

function mySide(){
 if(appState.connection!=='friend')return 0;
 const b=appState.battle;
 if(!b)return 0;
 const i=b.teams.findIndex(t=>t.some(f=>f.ownerId===onlinePlayerId));
 return i>=0?i:0;
}

function sendOnline(data){
 if(socket&&socket.readyState===WebSocket.OPEN){
  socket.send(JSON.stringify(data));
 }
}

function connectOnline(){
 return new Promise((resolve,reject)=>{
  if(socket&&socket.readyState===WebSocket.OPEN)return resolve();

  const protocol=location.protocol==='https:'?'wss:':'ws:';
  socket=new WebSocket(`${protocol}//${location.host}`);

  socket.addEventListener('open',()=>resolve(),{once:true});
  socket.addEventListener('error',()=>reject(new Error('接続失敗')),{once:true});
  socket.addEventListener('message',event=>{
   try{
    handleOnlineMessage(JSON.parse(event.data));
   }catch(e){
    console.error(e);
   }
  });
 });
}

function handleOnlineMessage(data){

 if(data.type==='room_created'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋番号</p>
    <div class="room">${data.roomCode}</div>
    <p class="small">友達の参加を待っています…</p>
    <p id="onlinePlayerCount">参加人数 1人</p>`;
 }

 if(data.type==='room_joined'){
  onlinePlayerId=data.playerId;
  onlineRoomCode=data.roomCode;
  onlineHostId=data.hostId;
  appState.connection='friend';

  document.getElementById('roomInfo').innerHTML=
   `<p>部屋 ${data.roomCode} に参加しました。</p>
    <p id="onlinePlayerCount">参加人数を確認中…</p>
    <p class="small">部屋を作った人がモードを選びます。</p>`;

  if(data.mode&&data.mode!=='pending'){
   appState.mode=data.mode;
   appState.selected=[];
   renderSelection();
   show('select');
  }
 }

 if(data.type==='room_state'){
  onlineHostId=data.hostId;

  const el=document.getElementById('onlinePlayerCount');
  if(el)el.textContent=`参加人数 ${data.count}人`;

  if(!data.started&&data.mode==='pending'&&isOnlineHost()&&data.count>=2){
   const info=document.getElementById('roomInfo');

   if(info&&!document.getElementById('modeGoBtn')){
    info.insertAdjacentHTML(
     'beforeend',
     '<button id="modeGoBtn" class="btn primary" onclick="show(\'mode\')">ゲームモード選択へ</button>'
    );
   }
  }
 }

 if(data.type==='mode_set'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  appState.selected=[];
  renderSelection();
  show('select');
 }

 if(data.type==='ready_state'){
  const ri=document.getElementById('readyInfo');

  if(ri){
   ri.textContent=`準備完了 ${data.readyCount}/${data.total}`;
  }

  const me=data.players?.find(p=>p.id===onlinePlayerId);
  const btn=document.getElementById('startBtn');

  if(btn&&me?.ready){
   btn.disabled=true;
   btn.textContent='準備完了済み';
  }
 }

 if(data.type==='battle_start'){
  onlineHostId=data.hostId;
  appState.mode=data.mode;
  onlineWaitingAction=false;

  buildOnlineBattle(data.players,data.mode);
  show('battle');

  if(isOnlineHost()){
   beginTurn();
   broadcastBattleState();
  }else{
   document.getElementById('moves').innerHTML=
    '<button class="btn" disabled>対戦開始を同期中…</button>';
  }
 }

 if(data.type==='action_selected'){
  const tl=document.getElementById('turnLabel');

  if(tl&&appState.battle){
   tl.textContent=
    `ターン ${appState.battle.turn}　行動待ち ${data.selectedCount}/${data.total}`;
  }
 }

 if(
  data.type==='all_actions_selected' &&
  isOnlineHost() &&
  appState.battle &&
  !appState.battle.finished
 ){
  runOnlineTurn(data.actions);
  broadcastBattleState();
 }

 if(data.type==='battle_state'){
  appState.battle=data.battle;
  onlineWaitingAction=false;

  show('battle');
  renderBattle();

  if(appState.battle.finished){
   showOnlineResult();
   return;
  }

  maybeAutoOnlineAction();
 }

 if(data.type==='player_left'){
  alert('参加者が退出しました。');
 }

 if(data.type==='error'){
  alert(data.message);
 }
}

async function createRoom(){
 try{
  await connectOnline();
  sendOnline({type:'create_room'});
  document.getElementById('roomInfo').innerHTML='<p>部屋を作成しています…</p>';
 }catch(e){
  alert('オンラインサーバーに接続できません。');
 }
}

async function joinRoom(){
 const v=document.getElementById('roomInput').value.trim();

 if(!/^\d{4}$/.test(v)){
  return alert('4桁の部屋番号を入力してください。');
 }

 try{
  await connectOnline();
  sendOnline({type:'join_room',roomCode:v});
  document.getElementById('roomInfo').innerHTML='<p>部屋に接続しています…</p>';
 }catch(e){
  alert('オンラインサーバーに接続できません。');
 }
}

function setMode(m){

 if(appState.connection==='friend'){
  if(!isOnlineHost()){
   return alert('ゲームモードは部屋を作った人が選択します。');
  }

  sendOnline({
   type:'set_mode',
   mode:m
  });

  return;
 }

 appState.mode=m;
 appState.selected=[];
 renderSelection();
 show('select');
}

function renderSelection(){

 const need=appState.mode==='team3'?3:1;
 const online=appState.connection==='friend';

 document.getElementById('selectGuide').textContent=
  appState.mode==='ffa4'
   ?(
     online
      ?'自分のキャラを1人選択。オンラインではCPなし・参加人数上限なし。'
      :'自分のキャラを1人選択。残り3人はCP。'
    )
   :`自分側 ${need}人を選択`;

 const sb=document.getElementById('startBtn');

 if(sb){
  sb.textContent=online?'準備完了':'対戦開始';
  sb.disabled=false;
 }

 const ri=document.getElementById('readyInfo');

 if(ri){
  ri.textContent='';
 }

 const g=document.getElementById('charGrid');
 g.innerHTML='';

 chars.forEach((c,i)=>{
  const d=document.createElement('div');

  d.className=
   'card character'+
   (appState.selected.includes(i)?' selected':'');

  d.innerHTML=
   `<h3>${c.name}</h3>
    <div class="stats">
      <div class="stat">HP<br>${c.hp}</div>
      <div class="stat">精神<br>${c.mental}</div>
      <div class="stat">MP<br>${c.mp}</div>
    </div>
    <div>
      ${c.races.map(x=>`<span class="tag">${x}</span>`).join('')}
    </div>
    <div class="small">特性: ${c.traits.join(' / ')}</div>`;

  d.onclick=()=>selectChar(i);

  attachTip(
   d,
   characterDetail(c)
  );

  g.appendChild(d);
 });
}

function selectChar(i){

 const need=appState.mode==='team3'?3:1;

 if(appState.selected.includes(i)){
  appState.selected=
   appState.selected.filter(x=>x!==i);

 }else if(appState.selected.length<need){
  appState.selected.push(i);

 }else{
  appState.selected[appState.selected.length-1]=i;
 }

 renderSelection();
}

function characterDetail(c){
 return `${c.name}
HP ${c.hp} / 精神 ${c.mental} / MP ${c.mp}
種族: ${c.races.join(', ')}
特性: ${c.traits.join(', ')}
技: ${Object.keys({...commonMoves,...c.moves}).join(', ')}`;
}

function attachTip(el,text){

 let timer;
 const tip=document.getElementById('tooltip');

 el.addEventListener('mouseenter',e=>{
  if(matchMedia('(hover:hover)').matches){
   tip.textContent=text;
   tip.style.display='block';
   moveTip(e);
  }
 });

 el.addEventListener('mousemove',moveTip);

 el.addEventListener('mouseleave',()=>{
  tip.style.display='none';
 });

 el.addEventListener('touchstart',()=>{
  timer=setTimeout(()=>{
   tip.textContent=text;
   tip.style.left='12px';
   tip.style.bottom='12px';
   tip.style.top='auto';
   tip.style.display='block';
  },450);
 },{passive:true});

 el.addEventListener('touchend',()=>{
  clearTimeout(timer);
  setTimeout(()=>{
   tip.style.display='none';
  },700);
 });
}

function moveTip(e){

 tip.style.left=

function cloneFighter(c,side,index=0){
 return {
  base:c,
  name:c.name,
  maxHp:c.hp,
  hp:c.hp,
  maxMental:c.mental,
  mental:c.mental,
  maxMp:c.mp,
  mp:c.mp,
  side,
  index,
  alive:true,
  guard:0,
  nextP:1,
  nextM:1,
  mentalTakenMul:1,
  gundam:false,
  rampage:0,
  mentalResistStacks:0,
  verbalDot:0,
  entangled:false,
  swimming:false,
  skip:false,
  traits:[...c.traits],
  races:[...c.races],
  moves:{...commonMoves,...c.moves},
  lastDebuffs:[]
 };
}

function startBattle(){

 const need=
  appState.mode==='team3'?3:1;

 if(appState.selected.length<need){
  return alert(`キャラを${need}人選択してください。`);
 }

 if(appState.connection==='friend'){

  sendOnline({
   type:'ready',
   selections:[...appState.selected]
  });

  const b=
   document.getElementById('startBtn');

  if(b){
   b.disabled=true;
   b.textContent='準備完了済み';
  }

  const ri=
   document.getElementById('readyInfo');

  if(ri){
   ri.textContent=
    'ほかの参加者を待っています…';
  }

  return;
 }

 const used=
  new Set(appState.selected);

 const pool=
  chars
   .map((_,i)=>i)
   .filter(i=>!used.has(i));

 shuffle(pool);

 let b={
  turn:1,
  mode:appState.mode,
  teams:[],
  active:[0,0],
  log:[],
  finished:false
 };

 if(appState.mode==='duel'){

  b.teams=[
   [
    cloneFighter(
     chars[appState.selected[0]],
     0
    )
   ],
   [
    cloneFighter(
     chars[pool[0]],
     1
    )
   ]
  ];

 }else if(appState.mode==='team3'){

  b.teams=[
   appState.selected.map(
    (i,j)=>cloneFighter(chars[i],0,j)
   ),
   pool.slice(0,3).map(
    (i,j)=>cloneFighter(chars[i],1,j)
   )
  ];

 }else{

  b.teams=[
   [cloneFighter(chars[appState.selected[0]],0)],
   [cloneFighter(chars[pool[0]],1)],
   [cloneFighter(chars[pool[1]],2)],
   [cloneFighter(chars[pool[2]],3)]
  ];

  b.active=[0,0,0,0];
 }

 appState.battle=b;

 appState.lastSetup={
  ...appState,
  selected:[...appState.selected],
  battle:null,
  lastSetup:null
 };

 show('battle');
 beginTurn();
}

function buildOnlineBattle(players,mode){

 const teams=
  players.map(
   (p,side)=>
    p.selections.map(
     (ci,j)=>{
      const f=
       cloneFighter(
        chars[ci],
        side,
        j
       );

      f.ownerId=p.id;

      return f;
     }
    )
  );

 appState.battle={
  turn:1,
  mode,
  teams,
  active:teams.map(()=>0),
  log:[],
  finished:false,
  winnerOwnerId:null
 };
}

function aliveOnlinePlayerIds(){

 const b=appState.battle;

 return b.teams
  .filter(
   t=>t.some(f=>f.alive)
  )
  .map(
   t=>t.find(Boolean)?.ownerId
  )
  .filter(Boolean);
}

  );

function runOnlineTurn(actions){

 const b=appState.battle;

 if(!b||b.finished){
  return;
 }

 const acts=[];

 for(
  let s=0;
  s<b.teams.length;
  s++
 ){
  const f=activeF(s);

  if(!f||!f.alive){
   continue;
  }

  const a=
   actions[f.ownerId]||
   {type:'none'};

  acts.push({f,a});
 }

 for(const x of acts){

  if(x.a.type==='move'){

   const m=
    x.f.moves[x.a.name];

   if(m?.priorityGuard){
    x.f.guard=
     m.guard||10;
   }

   if(
    m?.special==='dogGuard' ||
    m?.special==='lost'
   ){
    x.f.guard=9999;
   }
  }
 }

 acts.sort(
  (x,y)=>
   priorityScore(y)-
   priorityScore(x)||
   Math.random()-.5
 );

 for(const x of acts){

  if(!x.f.alive){
   continue;
  }

  let targets=
   allActive()
    .filter(
     q=>q!==x.f&&q.alive
    );

  if(
   b.mode==='ffa4' &&
   targets.length>1
  ){
   const i=
    targets.findIndex(
     t=>t.side>x.f.side
    );

   if(i>0){
    targets=[
     ...targets.slice(i),
     ...targets.slice(0,i)
    ];
   }
  }

  executeAction(
   x.f,
   x.a,
   targets
  );

  checkDeaths();

  if(b.finished){
   break;
  }
 }

 if(!b.finished){
  endTurn();
 }
}

function shuffle(a){
 for(
  let i=a.length-1;
  i>0;
  i--
 ){
  const j=
   Math.floor(
    Math.random()*(i+1)
   );

  [a[i],a[j]]=
   [a[j],a[i]];
 }

 return a;
}

function activeF(side){
 const b=appState.battle;
 return b.teams[side][b.active[side]||0];
}

function allActive(){
 const b=appState.battle;

 return b.teams
  .map(
   (t,i)=>t[b.active[i]||0]
  )
  .filter(Boolean);
}

function beginTurn(){

 const b=appState.battle;

 if(b.finished){
  return;
 }

 allActive().forEach(f=>{

  if(!f.alive){
   return;
  }

  let regen=
   1+
   (
    f.traits.includes('じーぴーえー')
     ?1
     :0
   );

  f.mp=
   Math.min(
    f.maxMp,
    f.mp+regen
   );

  if(f.traits.includes('むしば')){
   directDamage(
    f,
    2,
    2,
    'むしば'
   );
  }

  if(
   f.traits.includes('じあいのこころ')
  ){
   f.mental=
    Math.min(
     f.maxMental,
     f.mental+5
    );
  }

  if(
   f.traits.includes('ちゅうそつのいでんし') &&
   Math.random()<P.normal
  ){
   f.hp=
    Math.min(
     f.maxHp,
     f.hp+5
    );
  }

  if(
   f.traits.includes('できん')
  ){
   f.nextM*=1.1;
  }

  if(
   f.traits.includes('むげん成長')
  ){
   f.maxHp=
    Math.round(f.maxHp*1.1);

   f.hp=
    Math.round(f.hp*1.1);

   f.maxMental=
    Math.round(f.maxMental*1.1);

   f.mental=
    Math.round(f.mental*1.1);

   f.maxMp=
    Math.round(f.maxMp*1.1);

   f.mp=
    Math.round(f.mp*1.1);

   if(b.turn%2===0){
    f.maxMp+=1;
   }
  }

  if(f.verbalDot>0){
   directDamage(
    f,
    0,
    5*f.verbalDot,
    'ばとう'
   );
  }
 });

 applyGlobalStart();
 checkDeaths();
 renderBattle();
 log(`--- ターン ${b.turn} ---`);

 if(
  !b.finished &&
  appState.connection==='cpu' &&
  activeF(0)?.swimming
 ){
  setTimeout(()=>{
   const cur=
    appState.battle;

   if(
    cur &&
    !cur.finished &&
    activeF(0)?.swimming
   ){
    runTurn({type:'none'});
   }
  },0);
 }

 if(
  !b.finished &&
  appState.connection==='friend'
 ){
  maybeAutoOnlineAction();
 }
}

function applyGlobalStart(){

 const acts=allActive();

 for(const src of acts){

  if(src.traits.includes('あくしゅう')){

   for(const t of acts){

    if(t!==src&&t.alive){
     applyDamage(
      src,
      t,
      {
       mental:2,
       tags:['におい']
      },
      true
     );
    }
   }
  }
 }

 for(const src of acts){

  if(src.traits.includes('うわきしょう')){

   const women=
    acts.filter(
     x=>
      x!==src &&
      x.races.includes('おんな') &&
      x.alive
    );

   for(const w of women){

    const take=
     Math.min(1,w.mp);

    w.mp-=take;

    src.mp=
     Math.min(
      src.maxMp,
      src.mp+take
     );
   }

   if(
    women.length &&
    Math.random()<P.normal
   ){
    if(Math.random()<.5){
     src.hp-=5*women.length;
    }else{
     src.mental-=5*women.length;
    }
   }
  }
 }
}

function statusText(f){

 if(f.gundam)a.push('ガンダム');

 if(f.mentalResistStacks)a.push(`ねんてん×${f.mentalResistStacks}`);

function chooseCpu(f){

 if(f.swimming){
  return {type:'none'};
 }

 if(f.rampage>0){

  const ks=
   Object.keys(f.moves);

  return {
   type:'move',
   name:
    ks[
     Math.floor(
      Math.random()*ks.length
     )
    ]
  };
 }

 let ks=
  Object.entries(f.moves)
   .filter(
    ([,m])=>
     f.mp>=
     effectiveCost(
      f,
      m.mp||0
     )
   );

 if(!ks.length){
  return {
   type:'move',
   name:'なぐる'
  };
 }

 ks=
  ks.filter(
   ([n])=>
    n!=='防御'||
    Math.random()<.35
  );

 return {
  type:'move',
  name:
   ks[
    Math.floor(
     Math.random()*ks.length
    )
   ][0]
 };
}

function runTurn(player){

 const b=
  appState.battle;

 if(b.finished){
  return;
 }

 let acts=[];

 if(b.mode==='ffa4'){

  acts.push({
   f:activeF(0),
   a:player
  });

  for(let s=1;s<4;s++){

   acts.push({
    f:activeF(s),
    a:chooseCpu(activeF(s))
   });
  }

 }else{

  acts=[
   {
    f:activeF(0),
    a:player
   },
   {
    f:activeF(1),
    a:chooseCpu(activeF(1))
   }
  ];
 }

 for(const x of acts){

  if(x.a.type==='move'){

   const m=
    x.f.moves[x.a.name];

   if(m?.priorityGuard){
    x.f.guard=
     m.guard||10;
   }

   if(m?.special==='dogGuard'){
    x.f.guard=9999;
   }

   if(m?.special==='lost'){
    x.f.guard=9999;
   }
  }
 }

 acts.sort(
  (x,y)=>
   priorityScore(y)-
   priorityScore(x)||
   Math.random()-.5
 );

 for(const x of acts){

  if(!x.f.alive){
   continue;
  }

  executeAction(
   x.f,
   x.a,
   acts
    .map(z=>z.f)
    .filter(
     q=>q!==x.f&&q.alive
    )
  );

  checkDeaths();

  if(b.finished){
   break;
  }
 }

 endTurn();
}

function priorityScore(x){

 if(x.a.type==='switch'){
  return 50;
 }

 if(x.a.type!=='move'){
  return 0;
 }

 const m=
  x.f.moves[x.a.name]||{};

 if(m.copyPriority){
  return -100;
 }

 if(
  m.priorityGuard ||
  m.special==='dogGuard' ||
  m.special==='lost'
 ){
  return -10;
 }

 if(m.priority){
  return 20;
 }

 if(
  x.f.traits.includes('だんそんじょひ') &&
  allActive().some(
   t=>
    t!==x.f &&
    t.races.includes('おんな')
  )
 ){
  return 15;
 }

 if(
  x.f.traits.includes('ごうまん')
 ){
  return 3;
 }

 return 0;
}

function executeAction(f,a,targets){

 if(a.type==='none'){
  return;
 }

 if(a.type==='switch'){

  log(`${f.name}は交代した`);

  appState.battle.active[f.side]=a.to;

  return;
 }

 const n=a.name;
 const m=f.moves[n];

 if(!m){
  return;
 }

 const cost=
  effectiveCost(
   f,
   m.mp||0
  );

 if(f.mp<cost){

  log(
   `${f.name}はMP不足で${n}を使えない`
  );

  return;
 }

 if(
  f.traits.includes('できん') &&
  Math.random()<P.normal
 ){
  log(
   `${f.name}はできんで行動できなかった`
  );

  return;
 }

 f.mp-=cost;

 log(
  `${f.name}の「${n}」`
 );

 sfx(360,.045);
  // あばれうま中：1/3で自分を攻撃
if(
  f.rampage>0 &&
  Math.random()<1/3 &&
  (m.physical || m.multi)
){
  log(`${f.name}は暴走して自分を攻撃した！`);

  if(m.multi){
    for(const hit of m.multi){
      directDamage(
        f,
        Math.round(hit * f.nextP* 0.5),
        0,
        'あばれうま自傷'
      );
    }
  }else{
    directDamage(
      f,
      Math.round((m.physical || 0) * f.nextP * 0.5),
      0,
      'あばれうま自傷'
    );
  }

  return;
}

 if(m.special==='copy'){

  const enemy=
   targets[0];

  if(!enemy){
   return;
  }

  const enemyAct=
   chooseCpu(enemy);

  log(
   'えんげきの構え。相手の行動を模倣する'
  );

  if(Math.random()<P.low){
   log(
    `${f.name}は低確率回避に成功`
   );
  }

  executeAction(
   enemy,
   enemyAct,
   [f]
  );

  if(!f.alive){
   return;
  }

  if(
   enemyAct.type==='move' &&
   enemy.moves[enemyAct.name]
  ){
   executeMoveEffect(
    f,
    enemyAct.name,
    enemy.moves[enemyAct.name],
    [enemy],
    true
   );
  }

  return;
 }

 executeMoveEffect(
  f,
  n,
  m,
  targets,
  false
 );
}

function executeMoveEffect(f,n,m,targets){

 if(m.special==='gundam'){

  if(f.gundam){
   log('ガンダムはすでにいる');
  }else{
   f.gundam=true;
  }

  return;
 }

if(m.special==='rampage'){
  f.rampage=4;
  log(`${f.name}は暴れ始めた！ 次のターンから3ターン物理攻撃が2倍になる`);
  return;
}

 if(m.special==='mentalResistStack'){
  f.mentalResistStacks=
   Math.min(
    4,
    f.mentalResistStacks+1
   );
 }

 if(m.special==='verbalDot'){

  const t=
   targets[0];

  if(t){
   t.verbalDot=
    Math.min(
     6,
     t.verbalDot+1
    );
  }

  return;
 }

 if(m.special==='entangle'){

  if(targets[0]){
   targets[0].entangled=true;
  }

  return;
 }

 if(m.special==='stealMp'){

  const t=
   targets[0];

  if(!t){
   return;
  }

  const q=
   Math.min(1,t.mp);

  t.mp-=q;

  f.mp=
   Math.min(
    f.maxMp,
    f.mp+q
   );

  return;
 }

 if(m.special==='invest'){

  if(f.mp<=0){
   return log(
    'MPが0以下なので投資できない'
   );
  }

  const ok=
   Math.random()<P.normal;

  if(ok){
   f.mp=
    Math.min(
     f.maxMp,
     f.mp+5
    );

   log('投資成功');
  }else{
   f.mp-=5;
   log('投資失敗');
  }

  return;
 }

 if(m.special==='gamble'){

  const ok=
   Math.random()<P.normal;

  let dmg=
   ok?50:0;

  if(
   f.traits.includes('ギャンブラー')
  ){
   if(ok){
    dmg*=1.5;
   }else{
    f.mp-=5;
   }
  }

  if(ok){
   applyDamage(
    f,
    targets[0],
    {physical:dmg}
   );
  }else{
   log('ギャンブル失敗');
  }

  return;
 }

 if(m.special==='affair'){

  const t=
   targets[0];

  if(
   t &&
   t.races.includes('おんな')
  ){
   applyDamage(
    f,
    t,
    {mental:50}
   );
  }

  if(Math.random()<P.normal){
   directDamage(
    f,
    20,
    0,
    'うわき反動'
   );
  }

  return;
 }

 if(m.special==='seiri'){

  const t=
   targets[0];

  if(!t){
   return;
  }

  if(
   t.traits.includes('じんだいのかこい')
  ){
   return log(
    'せいりは無効化された'
   );
  }

  const r=
   Math.random();

  if(r<1/3){
   directDamage(
    t,
    35,
    0,
    'せいり'
   );
  }else if(r<2/3){
   directDamage(
    t,
    0,
    35,
    'せいり'
   );
  }else{
   directDamage(
    t,
    35,
    35,
    'せいり'
   );
  }

  return;
 }

 if(m.special==='lost'){

  if(
   targets[0] &&
   Math.random()<P.normal
  ){
   targets[0].nextM*=1.2;
  }

  return;
 }

 if(m.special==='poop'){

  for(const t of allActive()){
   directDamage(
    t,
    0,
    20,
    'だっぷん'
   );
  }

  const t=
   targets[0];

  if(t){
   applyDamage(
    f,
    t,
    {physical:20}
   );
  }

  return;
 }

 if(m.special==='swim'){
  f.swimming=2;
  return;
 }

 if(m.allTargets){

  targets.forEach(
   t=>applyDamage(f,t,m)
  );

 }else if(m.multi){

  for(const hit of m.multi){

   applyDamage(
    f,
    targets[0],
    {
     physical:hit,
     tags:m.tags
    }
   );
  }

 }else if(
  (m.physical||m.mental) &&
  targets[0]
 ){
  applyDamage(
   f,
   targets[0],
   m
  );
 }

 if(
  m.special==='elderDouble' &&
  targets[0]?.races.includes('ろうじん')
 ){
  applyDamage(
   f,
   targets[0],
   {
    physical:m.physical||0,
    mental:m.mental||0
   }
  );
 }

 if(
  m.special==='wakeMp' &&
  targets[0]
 ){
  targets[0].mp=
   Math.min(
    targets[0].maxMp,
    targets[0].mp+2
   );
 }

 if(m.healHp){
  f.hp=
   Math.min(
    f.maxHp,
    f.hp+m.healHp
   );
 }

 if(m.healMental){
  f.mental=
   Math.min(
    f.maxMental,
    f.mental+m.healMental
   );
 }

 if(m.mpGain){
  f.mp=
   Math.min(
    f.maxMp,
    f.mp+m.mpGain
   );
 }

 if(m.selfHp){
  f.hp+=m.selfHp;
 }

 if(m.selfMental){
  f.mental+=m.selfMental;
 }

 if(m.randomMentalDrink){
  f.mental+=
   Math.random()<.5
    ?5
    :-5;
 }

 if(m.buffPhysicalNext){
  f.nextP*=
   m.buffPhysicalNext;
 }

 if(m.buffMentalNext){
  f.nextM*=
   m.buffMentalNext;
 }

 if(
  m.debuffEnemyMentalAtk &&
  targets[0]
 ){
  targets[0].nextM*=
   m.debuffEnemyMentalAtk;
 }
}

function effectiveCost(f,c){

 if(
  f.traits.includes('どくぜつ')
 ){
  return Math.max(
   0,
   c-1
  );
 }

 return c;
}

function applyDamage(src,t,m){

 if(!t||!t.alive){
  return;
 }

 if(
  (
   t.traits.includes('えんきんほう') ||
   t.traits.includes('おやのななひかり')
  ) &&
  m.physical &&
  Math.random()<P.evasion
 ){
  log(
   `${t.name}は物理攻撃を回避`
  );

  m={
   ...m,
   physical:0
  };
 }

 let p=m.physical||0;
 let q=m.mental||0;

 const tags=
  m.tags||[];

 if(p){

  p*=src.nextP;

  if(
   src.traits.includes('うんどうおんち')
  ){
   p*=.7;
  }

  if(
   src.traits.includes('きょたい')
  ){
   p*=1.2;
  }

  if(
   src.traits.includes('きけんしそう')
  ){
   p*=1.1;

   if(
    t.races.includes('もじゃもじゃ')
   ){
    p/=1.1;
    p*=1.2;
   }

   if(
    t.races.includes('デブ')
   ){
    p/=1.1;
    p*=1.4;
   }
  }

  if(
   src.traits.includes('かりめん')
  ){
   p+=20;
  }

  if(
   src.traits.includes('あかいろ') &&
   tags.includes('いろ')
  ){
   p*=1.2;
  }

  if(
   src.traits.includes('おおごえ') &&
   tags.includes('おと')
  ){
   p*=1.5;
  }

  if(
   src.traits.includes('ユーチューバー') &&
   (
    tags.includes('いろ') ||
    tags.includes('おと')
   )
  ){
   p*=1.2;
  }

  if(
   src.traits.includes('じゅんあい') &&
   t.traits.includes('うわきしょう')
  ){
   p*=1.2;
  }

  if(src.rampage>0){
   p*=2;
  }
 }

 if(q){

  q*=src.nextM;

  if(
   src.traits.includes('ふきんしん')
  ){
   q*=1.3;
  }

  if(
   src.traits.includes('れいしょうけい')
  ){
   q*=1.1;
  }

  if(
   src.traits.includes('ぼうず')
  ){
   q*=.75;
  }

  if(
   src.traits.includes('どくぜつ')
  ){
   q*=
    t.races.some(
     r=>
      [
       'fラン',
       'ろうにん',
       'ろうにんせい',
       'たんきだいがく'
      ].includes(r)
    )
     ?1.5
     :1.1;
  }

  if(
   src.traits.includes('じゅんあい') &&
   t.traits.includes('うわきしょう')
  ){
   q*=1.2;
  }

  if(
   src.traits.includes('ユーチューバー') &&
   (
    tags.includes('いろ') ||
    tags.includes('おと')
   )
  ){
   q*=1.2;
  }

  if(src.rampage>0){
   q*=2;
  }
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('しきもう')
 ){
  p=0;
  q=0;
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('しらが')
 ){
  p*=.8;
  q*=.8;
 }

 if(
  tags.includes('いろ') &&
  t.traits.includes('くろいろ')
 ){
  p*=1.5;
  q*=1.5;

  directDamage(
   src,
   10,
   0,
   'くろいろ反撃'
  );
 }

 if(
  t.traits.includes('ボケ') &&
  (
   tags.includes('いろ') ||
   tags.includes('おと') ||
   tags.includes('におい')
  )
 ){
  p*=.75;
  q*=.75;
 }

 if(
  t.traits.includes('無神経')
 ){
  p*=.8;
 }

 if(
  t.traits.includes('きょたい')
 ){
  p*=1.2;
 }

 if(
  t.traits.includes('めめしい')
 ){
  q*=1.2;
 }

 if(
  t.traits.includes('わがまま')
 ){
  q*=.5;
 }

 if(
  t.traits.includes('なぞのこうい') &&
  src.races.includes('おんな')
 ){
  q*=1.2;
 }

 if(
  t.traits.includes('いぬけい') &&
  src.races.includes('おんな')
 ){
  p*=.5;
 }

 if(
  t.traits.includes('びびり') &&
  (
   tags.includes('しんれい') ||
   tags.includes('びっくり')
  )
 ){
  p*=1.5;
  q*=1.5;
 }

 if(t.mentalResistStacks){
  q*=
   Math.pow(
    .7,
    t.mentalResistStacks
   );
 }

 if(
  t.traits.includes('しきもう') &&
  p &&
  'あばれうま反動()<P.normal
 ){
  p*=1.2;
 }

 if(
  t.traits.includes('まゆなし')
 ){
  p*=.9;
 }

 p=
  Math.round(
   Math.max(
    0,
    p-(t.guard||0)
   )
  );

 q=
  Math.round(
   Math.max(
    0,
    q-(t.guard||0)
   )
  );

 directDamage(
  t,
  p,
  q,
  src.name
 );

 animateF(
  t,
  p||q
   ?'shake'
   :'flash'
 );


 if(
  src.traits.includes('かりめん') &&
  Math.random()<P.accident
 ){
  directDamage(
   src,
   20,
   0,
   'かりめん反動'
  );
 }
}

function directDamage(t,p,q,why){

 t.hp-=
  Math.round(p||0);

 t.mental-=
  Math.round(q||0);

 if((p||q)&&why){

  log(
   `${t.name}に`+
   `${p?` HP-${Math.round(p)}`:''}`+
   `${q?` 精神-${Math.round(q)}`:''}`+
   ` (${why})`
  );
 }
}

function animateF(f,cl){

 const e=
  document.getElementById(
   'fighter-'+f.side
  );

 if(e){
  e.classList.remove(cl);
  void e.offsetWidth;
  e.classList.add(cl);
 }
}

function endTurn(){

 const b=
  appState.battle;

 if(b.finished){
  return;
 }

 for(const f of allActive()){

  if(f.gundam){

   for(const t of allActive()){

    if(
     t!==f &&
     t.alive
    ){
     applyDamage(
      f,
      t,
      {physical:10}
     );
    }
   }
  }

  if(f.swimming){

   f.swimming--;

   if(f.swimming===0){

    const ts=
     allActive()
      .filter(
       x=>
        x!==f &&
        x.alive
      );

    if(ts[0]){
     applyDamage(
      f,
      ts[0],
      {physical:40}
     );
    }
   }
  }

  if(f.rampage>0){
   f.rampage--;
  }

  f.guard=0;
  f.nextP=1;
  f.nextM=1;
 }

 checkDeaths();

 if(b.finished){
  return;
 }

 b.turn++;
 beginTurn();
}

function checkDeaths(){

 const b=
  appState.battle;

 for(
  let s=0;
  s<b.teams.length;
  s++
 ){

  const f=
   activeF(s);

  if(
   f &&
   f.alive &&
   (
    f.hp<=0 ||
    f.mental<=0
   )
  ){

   f.alive=false;
   f.hp=Math.max(0,f.hp);
   f.mental=Math.max(0,f.mental);

   log(
    `${f.name}は脱落した`
   );

   if(f.gundam){
    f.gundam=false;
   }

   if(b.mode==='team3'){

    const ni=
     b.teams[s]
      .findIndex(
       x=>x.alive
      );

    if(ni>=0){

     b.active[s]=ni;

     log(
      `${b.teams[s][ni].name}が場に出た`
     );
    }
   }
  }
 }

 if(
  appState.connection==='friend'
 ){

  const aliveSides=
   b.teams
    .map(
     (t,s)=>
      t.some(x=>x.alive)
       ?s
       :-1
    )
    .filter(
     s=>s>=0
    );

  if(aliveSides.length<=1){

   const winner=
    aliveSides.length
     ?b.teams[aliveSides[0]][0].ownerId
     :null;

   finish(
    winner===onlinePlayerId
     ?'勝利'
     :'敗北',
    winner
   );
  }

 }else if(
  b.mode==='ffa4'
 ){

  const alive=
   allActive()
    .filter(
     x=>x.alive
    );

  if(alive.length<=1){

   finish(
    alive[0]?.side===0
     ?'勝利'
     :'敗北'
   );
  }

 }else{

  const a=
   b.teams[0]
    .some(
     x=>x.alive
    );

  const c=
   b.teams[1]
    .some(
     x=>x.alive
    );

  if(!a||!c){

   finish(
    a
     ?'勝利'
     :'敗北'
   );
  }
 }
}

function finish(
 txt,
 winnerOwnerId=null
){

 const b=
  appState.battle;

 if(b.finished){
  return;
 }

 b.finished=true;
 b.winnerOwnerId=
  winnerOwnerId;

 sfx(
  txt==='勝利'
   ?660
   :180,
  .18
 );

 document.getElementById('resultText').textContent=
  txt;

 if(
  appState.connection!=='friend' ||
  !isOnlineHost()
 ){
  show('result');
 }
}

function showOnlineResult(){

 const b=
  appState.battle;

 document.getElementById('resultText').textContent=
  b.winnerOwnerId===onlinePlayerId
   ?'勝利'
   :'敗北';

 show('result');
}

function sfx(freq=330,dur=.05){

 try{

  const A=
   window.AudioContext||
   window.webkitAudioContext;

  const c=
   sfx.ctx||
   (
    sfx.ctx=
     new A()
   );

  const o=
   c.createOscillator();

  const g=
   c.createGain();

  o.frequency.value=
   freq;

  g.gain.value=
   .025;

  o.connect(g);
  g.connect(
   c.destination
  );

  o.start();

  g.gain.exponentialRampToValueAtTime(
   .0001,
   c.currentTime+dur
  );

  o.stop(
   c.currentTime+dur
  );

 }catch(e){}
}

function log(s){

 const b=
  appState.battle;

 b.log.push(s);
 renderBattle();
}

function retire(){

 if(
  appState.connection==='friend'
 ){
  return alert(
   '友人戦では退散できません。'
  );
 }

 show('home');
}

function rematch(){

 if(
  appState.connection==='friend'
 ){
  return alert(
   'オンライン再戦は現在、部屋を作り直してください。'
  );
 }

 startBattle();
}

function backToSelect(){
 renderSelection();
 show('select');
}
